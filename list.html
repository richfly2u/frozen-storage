<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>凱德佛堂 冷凍庫 材料清單</title>
<style>
  :root{--ink:#12323f;--dim:#7d909e;--green:#1e4d3b;--rule:#e3ebf0}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;padding:0 0 28px;background:#fbfcfd;color:var(--ink);
       font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
       font-size:14px;line-height:1.45}
  /* 標題帶 */
  .head{background:linear-gradient(135deg,#1e4d3b,#2f6f57);color:#fff;
        padding:20px 18px 16px;border-radius:0 0 22px 22px;margin-bottom:14px}
  h1{margin:0;font-size:20px;letter-spacing:.5px}
  .sub{margin:2px 0 0;font-size:12px;color:#cfe3da;letter-spacing:1px}
  #status{font-size:12.5px;color:#9fb3ab;padding:0 18px 8px}
  #map{padding:0 18px}
  /* 搜尋（貼在頂端，捲動時不會跑掉） */
  .search{position:sticky;top:0;z-index:6;background:#fbfcfd;padding:10px 18px 6px}
  .search input{width:100%;border:1px solid #dbe6ee;background:#fff;border-radius:12px;
       padding:9px 12px;font-size:14px;color:var(--ink);outline:none;font-family:inherit;
       -webkit-appearance:none;appearance:none}
  .search input::placeholder{color:#a8bac4}
  .search input:focus{border-color:#2f6f57;box-shadow:0 0 0 3px rgba(47,111,87,.12)}
  #hits{padding:0 18px;font-size:11.5px;color:#7f939e}
  #hits:not(:empty){padding:0 18px 6px}
  mark{background:#ffe9a8;color:inherit;border-radius:3px;padding:0 1px}
  /* 門 */
  .door{margin:0 0 16px}
  .dh{font-size:12px;font-weight:700;letter-spacing:3px;color:var(--green);
      border-bottom:2px solid #dfe9e4;padding-bottom:4px;margin:0 0 9px}
  /* 層 */
  .tier{margin:0 0 11px}
  .th{display:flex;align-items:center;gap:7px;margin:0 0 5px}
  .num{flex:0 0 auto;width:17px;height:17px;line-height:17px;text-align:center;
       font-size:10px;font-weight:700;color:#fff;background:#2f6f57;border-radius:6px}
  .tname{font-size:13.5px;font-weight:700;color:#143b2d}
  /* 品項明細：名稱＋數量一行，下面小字放放入者／更新時間／備註 */
  .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:2px 8px}
  .mi{min-width:0;border-bottom:1px solid #eef3f1;padding:3px 0}
  .mr{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 6px}
  .mn{font-weight:600;white-space:nowrap}
  .mq{margin-left:auto;white-space:nowrap;font-size:12.5px;font-weight:700;color:#1e4d3b;
      font-variant-numeric:tabular-nums}
  .md{margin-top:2px;font-size:10.5px;color:#7f939e;line-height:1.25}
  .empty{color:#b9c6ce;font-size:13.5px}
  /* 食材庫 */
  .lib{margin:16px 18px 0;padding:14px 0 0;border-top:1px dashed #dbe6ee}
  .libt{margin:0 0 6px;font-size:13px;font-weight:700;color:#8a7452}
  .foot{margin:18px 18px 0;font-size:11.5px;color:var(--dim);text-align:center}
  .warn{color:#8a2b2b;font-size:14px}
</style>
</head>
<body>
<div class="head"><h1>冷凍庫 材料清單</h1><p class="sub">凱德佛堂　炊事組</p></div>
<div class="search"><input id="q" type="search" placeholder="搜尋食材…" autocomplete="off" enterkeyhint="search"></div>
<div id="hits"></div>
<div id="status">連線中…</div>
<div id="map"></div>
<div class="lib" id="libBox" style="display:none">
  <p class="libt">食材庫（常備・尚未冰）</p>
  <div class="items" id="lib"></div>
</div>
<p class="foot">更新 <span id="upd">—</span></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const STAPLES = ["當歸", "枸杞", "紅棗", "豆包", "麵腸", "火腿", "素丸子", "牛蒡排", "鱈魚排", "飯巾布", "麵線", "饅頭", "包子", "綠豆沙餡", "小魚干", "紅糟麵腸", "黑豆", "花生仁", "大薏仁", "豆干", "大胖干", "核桃", "腰果", "海帶芽", "味噌"];
const FLOORS  = [{"id": 1, "door": "上門", "name": "中藥 湯料 五穀堅果"}, {"id": 2, "door": "上門", "name": "素料/餡料"}, {"id": 5, "door": "上門", "name": "素料"}, {"id": 3, "door": "下門", "name": "其他/私人"}, {"id": 4, "door": "下門", "name": "其他/粉類"}];
const DOORS   = [{ key:'U', label:'上門' }, { key:'D', label:'下門' }];

const $ = id => document.getElementById(id);
const app = initializeApp(window.FIREBASE_CONFIG);
const auth = getAuth(app);
const db = getFirestore(app);

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function floorNo(fid){
  const f = FLOORS.find(x => x.id === Number(fid));
  if (!f) return '';
  return FLOORS.filter(x => x.door === f.door).findIndex(x => x.id === f.id) + 1;
}
const byName = (a,b) => String(a.name||'').localeCompare(String(b.name||''), 'zh-Hant');

let ITEMS = [];
let QUERY = '';

/* 搜尋字串加上黃底標記（先轉義再包 mark，避免 XSS） */
function hi(t){
  const s = String(t == null ? '' : t);
  const q = QUERY.trim();
  if (!q) return esc(s);
  const i = s.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return esc(s);
  return esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + q.length)) + '</mark>' + esc(s.slice(i + q.length));
}

function fmtT(ms){
  if (!ms) return '';
  const d = new Date(Number(ms));
  const p = n => String(n).padStart(2, '0');
  return (d.getMonth()+1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function mi(it){
  const q = Number(it.qty) || 0;
  let md = [];
  if (it.updatedAt) md.push('更新 ' + fmtT(it.updatedAt));
  if (it.note) md.push('備註 ' + hi(it.note));
  return '<div class="mi">' +
    '<div class="mr"><span class="mn">' + hi(it.name) + '</span>' +
    (q > 0 ? '<span class="mq">' + esc(it.qty) + esc(it.unit||'') + '</span>' : '') +
    '</div>' +
    (md.length ? '<div class="md">' + md.join('　·　') + '</div>' : '') +
    '</div>';
}

function render(){
  const q = QUERY.trim().toLowerCase();
  const hit = v => !q || String(v == null ? '' : v).toLowerCase().indexOf(q) >= 0;
  const inF = ITEMS.filter(i => (Number(i.qty)||0) > 0 && FLOORS.some(f => f.id === Number(i.floor)))
                   .filter(i => hit(i.name) || hit(i.note));
  let html = '';
  DOORS.forEach(d => {
    let body = '';
    FLOORS.filter(f => f.door === d.label).forEach(f => {
      const list = inF.filter(i => Number(i.floor) === f.id).sort(byName);
      if (q && !list.length) return;              /* 搜尋中：沒中的層直接不顯示 */
      body += '<div class="tier"><div class="th"><span class="num">' + floorNo(f.id) +
              '</span><span class="tname">' + esc(f.name) + '</span></div>';
      body += list.length
        ? '<div class="items">' + list.map(mi).join('') + '</div>'
        : '<div class="empty">（目前空的）</div>';
      body += '</div>';
    });
    if (body) html += '<div class="door"><div class="dh">' + d.label + '</div>' + body + '</div>';
  });
  $('map').innerHTML = html;

  const names = new Set(ITEMS.map(i => i.name));
  const rest = STAPLES.filter(n => !names.has(n)).filter(hit);
  if (rest.length){
    $('libBox').style.display = '';
    $('lib').innerHTML = rest.map(n => '<div class="mi"><div class="mr"><span class="mn">' + hi(n) + '</span></div></div>').join('');
  } else {
    $('lib').innerHTML = '';
    $('libBox').style.display = 'none';
  }

  const n = inF.length + rest.length;
  $('hits').textContent = q
    ? (n ? '找到 ' + n + ' 項' : '沒有符合「' + QUERY.trim() + '」的食材')
    : '';
  $('upd').textContent = new Date().toLocaleString('zh-TW', { hour12:false });
}

$('q').addEventListener('input', () => { QUERY = $('q').value; render(); });

signInAnonymously(auth).then(() => {
  $('status').textContent = '';
  onSnapshot(query(collection(db, 'frozen_items'), orderBy('name')), snap => {
    ITEMS = snap.docs.map(d => ({ _id: d.id, ...d.data() }));
    render();
  }, err => {
    $('status').innerHTML = '<div class="warn">讀取失敗：' + esc(err.message) + '</div>';
  });
}).catch(e => {
  $('status').innerHTML = '<div class="warn">無法連線：' + esc(e.message) + '</div>';
});
</script>

</body>
</html>
