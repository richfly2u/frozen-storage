<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b4b6b">
<title>凱德佛堂 冷凍庫 物品位置管理</title>
<style>
:root{
  --ice:#f2f9fe; --line:#cfe4f2; --deep:#0b4b6b; --accent:#1e88c7;
  --ok:#178f60; --warn:#c9861a; --danger:#c9455a; --txt:#12313f; --muted:#6a8a9c;
  --card:#ffffff; --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:#eef6fb; color:var(--txt); padding-bottom:86px; font-size:16px;
}
/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:20; background:linear-gradient(160deg,#0b4b6b,#1a7ba8);
  color:#fff; padding:12px 14px 14px; box-shadow:0 3px 14px rgba(11,75,107,.25);
}
.hrow{display:flex;align-items:center;gap:8px}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.5px;flex:1}
.dot{width:9px;height:9px;border-radius:50%;background:var(--warn);flex:0 0 auto;box-shadow:0 0 0 3px rgba(255,255,255,.18)}
.dot.on{background:#4fd39a}.dot.off{background:#ff8a8a}
#syncTxt{font-size:12px;opacity:.9;margin-left:6px;white-space:nowrap}
#search{
  margin-top:10px;width:100%;border:none;border-radius:10px;padding:10px 12px;font-size:15px;
  background:rgba(255,255,255,.94);color:#12313f;
}
#search::placeholder{color:#8aa6b5}
.searchinfo{font-size:12.5px;margin-top:6px;color:#dff0fa;min-height:0}
/* ---------- tabs ---------- */
nav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:#fff;
  border-top:1px solid var(--line);box-shadow:0 -3px 14px rgba(11,75,107,.10);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1;border:none;background:none;padding:10px 4px 12px;font-size:12.5px;color:var(--muted);
  font-family:inherit;cursor:pointer;line-height:1.5
}
nav button b{display:block;font-size:19px;font-weight:400;filter:grayscale(1);opacity:.6}
nav button.on{color:var(--deep);font-weight:700}
nav button.on b{filter:none;opacity:1}
/* ---------- views ---------- */
.view{display:none;padding:12px}
.view.on{display:block}
.legend{font-size:12.5px;color:var(--muted);margin:0 2px 10px;line-height:1.6}
/* ---------- 商用不鏽鋼雙門冰櫃（上下門、玻璃門片） ---------- */
.freezer{
  max-width:480px;margin:0 auto;padding:10px 12px 0;
  background:linear-gradient(180deg,#eef2f5,#c8d3db);
  border:2px solid #b6c3ce;border-radius:16px 16px 8px 8px;
  box-shadow:0 12px 28px rgba(18,38,56,.20),inset 0 1px 0 #fff
}
.fridge-top{display:flex;align-items:center;gap:8px;padding:6px 8px;margin-bottom:10px;border-radius:8px;
  background:linear-gradient(180deg,#3b4750,#20282e)}
.fridge-top .vent{flex:1;height:13px;border-radius:3px;opacity:.9;
  background:repeating-linear-gradient(90deg,#0a0e11 0 4px,#4c5860 4px 8px)}
.fridge-top .panel{background:#080b0d;color:#ff5d4c;font:700 12px/1 ui-monospace,SFMono-Regular,monospace;
  padding:5px 8px;border-radius:5px;letter-spacing:1px;box-shadow:inset 0 0 7px rgba(255,93,76,.35)}
.doors{display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:14px;padding-right:28px}
.door{
  position:relative;border-radius:12px;padding:10px 12px;min-width:0;
  background:linear-gradient(165deg,rgba(232,245,255,.62),rgba(198,224,243,.40));
  border:3px solid #c6d2db;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),0 3px 10px rgba(18,38,56,.14)
}
/* 上下門色系區隔：上門＝藍、下門＝綠 */
.door[data-door="U"]{
  background:linear-gradient(165deg,rgba(228,243,255,.74),rgba(184,219,244,.46));
  border-color:#b3cde4;box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),0 3px 10px rgba(20,80,130,.16)
}
.door[data-door="D"]{
  background:linear-gradient(165deg,rgba(229,249,240,.74),rgba(183,229,211,.46));
  border-color:#abcbbd;box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),0 3px 10px rgba(16,90,70,.16)
}
.door::before{
  content:"";position:absolute;inset:0;border-radius:9px;pointer-events:none;opacity:.5;z-index:0;
  background:linear-gradient(115deg,rgba(255,255,255,.8) 0 9%,rgba(255,255,255,0) 30% 100%)
}
.door-head{position:absolute;top:9px;left:16px;font-size:12px;font-weight:700;color:#41586a;letter-spacing:3px;z-index:2;
  padding:2px 9px;border-radius:7px}
.door[data-door="U"] .door-head{color:#1a5c8c;background:rgba(31,127,181,.15)}
.door[data-door="D"] .door-head{color:#146b55;background:rgba(19,133,103,.15)}
/* 把手：凸出於門外的握把＋兩支連接支架（避免被誤認為捲軸） */
.door .handle{
  position:absolute;top:50%;right:-24px;transform:translateY(-50%);width:13px;height:32%;border-radius:7px;z-index:2;
  background:linear-gradient(90deg,#7b8891,#333c43 45%,#0a0e11);
  box-shadow:4px 3px 9px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.18)
}
.door .handle::before,.door .handle::after{
  content:"";position:absolute;right:11px;width:16px;height:8px;border-radius:2px;
  background:linear-gradient(180deg,#96a3ac,#5b666e);box-shadow:0 1px 2px rgba(0,0,0,.35)
}
.door .handle::before{top:4px}
.door .handle::after{bottom:4px}
/* 門鉸鏈 */
.door .hinge{
  position:absolute;left:-9px;width:10px;height:26px;border-radius:3px 0 0 3px;z-index:0;
  background:linear-gradient(180deg,#e3eaee,#98a5ae);box-shadow:0 1px 3px rgba(0,0,0,.3)
}
.door .hinge.h1{top:20%}
.door .hinge.h2{bottom:20%}
/* 門鎖（門右上角） */
.door .lock{
  position:absolute;top:9px;right:14px;width:13px;height:13px;border-radius:3px;z-index:2;
  background:linear-gradient(180deg,#454f57,#1b2126);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),0 1px 2px rgba(0,0,0,.4)
}
.door .lock::after{
  content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:4px;height:6px;border-radius:2px;background:#0a0e11
}
.shelves{position:relative;z-index:1;display:grid;grid-template-rows:auto auto;
  gap:6px;min-width:0;padding-top:17px}
.tier{
  position:relative;margin:0;padding:6px 5px 12px;min-width:0;display:flex;flex-direction:column;
  aspect-ratio:4 / 3;   /* 高:寬 = 3:4 */
  background:transparent;border:none;transition:box-shadow .25s,transform .25s
}
.tier::after{
  content:"";position:absolute;left:0;right:0;bottom:2px;height:3px;border-radius:3px;
  background:linear-gradient(180deg,#ffffff,#c2ced7);box-shadow:0 1px 2px rgba(0,0,0,.18)
}
.wheels{display:flex;justify-content:space-between;padding:10px 22px 6px}
.wheels i{width:13px;height:13px;border-radius:50%;
  background:radial-gradient(circle at 35% 32%,#717d85,#141a1f);box-shadow:0 1px 2px rgba(0,0,0,.4)}
@media (max-width:520px){
  .freezer{padding:8px 9px 0;border-radius:14px 14px 6px 6px}
  .fridge-top{padding:5px 6px;margin-bottom:8px}
  .doors{gap:10px;padding-right:22px}
  .door{padding:8px 10px;border-width:2px}
  .door .handle{width:11px;right:-19px}
  .door .handle::before,.door .handle::after{width:13px;height:7px;right:9px}
  .door .hinge{left:-7px;width:8px;height:20px}
  .door .lock{top:7px;right:11px;width:11px;height:11px}
  .door-head{top:7px;left:13px;font-size:11px;letter-spacing:2px}
  .shelves{padding-top:16px}
  .tier{padding:5px 4px 11px}
  .fl-sub{display:none}
  .fl-name{font-size:14px}
  .fl-badge{font-size:11px;padding:2px 7px}
  .tier-head{gap:5px}
  h1{font-size:15px;letter-spacing:0}
  #syncTxt{font-size:11.5px}
  .hrow{gap:6px}
  .items{flex-direction:column;gap:6px}
  .chip{width:100%;gap:6px;flex-wrap:wrap}
  .chip .nm{max-width:none;flex:1 1 auto}
  .chip .by{flex:1 0 100%;margin-top:1px}
}
.tier.focus{box-shadow:0 0 0 3px rgba(30,136,199,.35);transform:scale(1.012)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(30,136,199,.30)}50%{box-shadow:0 0 0 9px rgba(30,136,199,.14)}}
.tier.pulse{animation:pulse 1.1s ease-in-out 3}
.tier-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.fl-badge{
  background:linear-gradient(150deg,#0b4b6b,#2089bd);color:#fff;font-size:12px;font-weight:700;
  padding:3px 9px;border-radius:8px;letter-spacing:.5px;flex:0 0 auto
}
.tier[data-door="U"] .fl-badge{background:linear-gradient(150deg,#0b4b6b,#2089bd)}
.tier[data-door="D"] .fl-badge{background:linear-gradient(150deg,#0f5f4b,#1fa07a)}
.fl-name{font-weight:700;font-size:15.5px;overflow-wrap:anywhere;min-width:0}
.fl-sub{font-size:11.5px;color:var(--muted)}
.fl-count{margin-left:auto;font-size:12.5px;color:var(--accent);font-weight:700}
.items{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:10px;min-width:0}
.items .empty{font-size:13px;color:#9db4c2;padding:4px 2px}
.chip{
  border:1px solid #cfe6f4;background:#f0f8fe;border-radius:11px;padding:7px 10px;
  font-family:inherit;font-size:14px;color:var(--txt);cursor:pointer;display:inline-flex;
  align-items:center;gap:7px;max-width:100%;min-width:0
}
.chip:active{transform:scale(.97)}
.chip .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw;min-width:0}
.chip .q{background:#1e88c7;color:#fff;border-radius:7px;font-size:12.5px;padding:1px 7px;white-space:nowrap;font-weight:700}
.chip.low .q{background:var(--danger)}
.chip .nt{font-size:11.5px;color:var(--muted)}
.chip.hit{outline:3px solid #ffcf70;background:#fff8e6}
/* ---------- log ---------- */
.log-hint{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.logitem{
  display:flex;gap:9px;align-items:flex-start;background:#fff;border:1px solid #e3eef6;
  border-radius:12px;padding:9px 11px;margin-bottom:7px
}
.logitem .ic{font-size:17px;line-height:1.25}
.logitem .body{flex:1;min-width:0}
.logitem .t1{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logitem .t2{font-size:12px;color:var(--muted);margin-top:2px}
.badge-in{color:var(--ok);font-weight:700}
.badge-out{color:var(--danger);font-weight:700}
.btn{
  border:none;border-radius:10px;padding:10px 14px;font-family:inherit;font-size:15px;
  background:var(--accent);color:#fff;font-weight:700;cursor:pointer
}
.btn.ghost{background:#eaf4fb;color:var(--deep);border:1px solid #cfe4f2}
.btn.sm{padding:7px 11px;font-size:13.5px;border-radius:9px}
/* ---------- modal ---------- */
.mask{
  position:fixed;inset:0;background:rgba(8,38,55,.55);z-index:50;display:none;
  align-items:flex-end;justify-content:center
}
.mask.on{display:flex}
.sheet{
  background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px 22px;
  max-height:92vh;overflow:auto;animation:up .22s ease-out
}
@keyframes up{from{transform:translateY(28px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 12px;font-size:17px}
label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=number],select,textarea{
  width:100%;border:1px solid #cfe0ec;border-radius:10px;padding:10px;font-size:16px;
  font-family:inherit;background:#fbfdff;color:var(--txt)
}
.row{display:flex;gap:10px}.row>*{flex:1}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{
  width:46px;height:46px;border-radius:12px;border:1px solid #cfe4f2;background:#eef7fd;
  font-size:22px;font-weight:700;color:var(--deep);cursor:pointer;font-family:inherit;line-height:1
}
.stepper input{text-align:center;font-size:20px;font-weight:700}
.acts{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
.acts .btn{flex:1;min-width:96px}
.btn.danger{background:var(--danger)}
.btn.ok{background:var(--ok)}
.tiny{font-size:12px;color:var(--muted);margin-top:9px;line-height:1.6}
#toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:80;
  background:rgba(11,75,107,.94);color:#fff;padding:10px 16px;border-radius:11px;font-size:14px;
  opacity:0;pointer-events:none;transition:opacity .25s;max-width:88vw;text-align:center
}
#toast.on{opacity:1}
/* ---------- 經手人 / LINE 提示 ---------- */
.opbar{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12.5px;color:#dff0fa}
.opbar b{color:#fff;background:rgba(255,255,255,.18);padding:3px 9px;border-radius:8px;font-size:13px}
.opbar button{
  margin-left:8px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:#fff;
  border-radius:8px;padding:5px 11px;font-size:12.5px;font-family:inherit;cursor:pointer
}
.opbar > button:first-of-type{margin-left:auto}
.bytip{margin-top:7px;font-size:12px;line-height:1.55;color:#eaf6fd;background:rgba(255,255,255,.12);padding:7px 10px;border-radius:9px;display:none}
.bytip.on{display:block}
.bytip a{color:#fff}
.logfilter{
  width:100%;margin:0 0 10px;border:1px solid #cfe0ec;border-radius:10px;padding:9px 10px;
  font-family:inherit;font-size:15px;background:#fbfdff;color:var(--txt)
}
.chip .by{font-size:11px;color:#7c93a2;white-space:nowrap}
/* ---------- 語音（與位置圖同頁） ---------- */
.voice-bar{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #dbeaf4;border-radius:12px;padding:8px 11px;font-size:13px;margin:0 2px 10px}
.voice-bar #vState{flex:1;color:var(--muted);min-width:0}
.voice-bar .btn{padding:7px 12px;font-size:13.5px;border-radius:9px}
.vdot{width:11px;height:11px;border-radius:50%;background:#c9d6de;flex:0 0 auto}
.vdot.live{background:#e0355a;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.vheard{background:#0b4b6b;color:#eaf6fd;border-radius:12px;padding:11px 13px;font-size:15px;margin-bottom:11px;line-height:1.5}
.vheard b{color:#8fdcff}
.vcard{background:#fff;border:2px solid #1e88c7;border-radius:16px;padding:14px;box-shadow:0 6px 20px rgba(11,75,107,.12);margin-bottom:11px}
.vcard .big{font-size:21px;font-weight:700;line-height:1.5}
.vcard .big .nm{color:#0b4b6b}
.vcard .sub{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.6}
.vcard.warn{border-color:#c9455a}
.vhint{font-size:12.5px;color:var(--muted);line-height:1.75;margin:12px 2px}
.vhint code{background:#eef7fd;padding:1px 6px;border-radius:5px;font-size:12.5px;color:#0b4b6b}
/* ---------- print ---------- */
@media print{
  body{background:#fff;padding:0}
  header,nav,.no-print,.voice-bar,#toast{display:none !important}
  #view-map .freezer{max-width:none}
}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <h1>❄️ 凱德佛堂 冷凍庫 物品位置管理</h1>
    <div class="dot" id="dot"></div><span id="syncTxt">連線中…</span>
  </div>
  <input id="search" type="text" autocomplete="off" placeholder="搜尋品名（例：當歸、素排）…">
  <div class="searchinfo" id="searchInfo"></div>
  <div class="opbar">
    <span>經手人：</span><b id="opName">未設定</b>
    <button type="button" id="btnLine" style="display:none">🔑 用 LINE 登入</button>
    <button type="button" id="btnOp">修改</button>
  </div>
  <div class="bytip" id="lineTip">
    目前在 <b>LINE 內建瀏覽器</b>。若按了沒反應，請點右上角「⋯」→ 用其他瀏覽器開啟本頁。
  </div>
</header>

<!-- ============ 位置圖（含語音輸入） ============ -->
<section class="view on" id="view-map">
  <p class="legend" id="focusBar" style="display:none"></p>
  <p class="legend">點任一物品可修改數量／刪除；按 <b>＋新增</b> 登錄新物品。<b>只寫品名＝還有 1 包</b>；標紅色「用完」＝已經沒有了。</p>

  <!-- 語音輸入（與位置圖同一頁） -->
  <div class="voice-bar">
    <span class="vdot" id="vDot"></span>
    <span id="vState">語音未啟動</span>
    <button class="btn sm" id="btnListen">🎤 開始聽</button>
    <button class="btn sm ghost" id="btnStop">停止</button>
  </div>
  <div class="vheard" id="vHeard" hidden></div>
  <div id="vCard"></div>

  <div class="freezer" id="freezer"></div>
  <div style="margin:14px 4px 0"><button class="btn ghost" id="btnAdd" style="width:100%">＋ 新增物品</button></div>
  <p class="vhint">
    語音：按「🎤 開始聽」後講 <code>香菇頭 一包</code>、<code>移出素排骨兩袋</code>、<code>放回當歸五包</code>；沒講動作＝預設「移出」，講錯按取消就好。第一次使用要按「允許」麥克風。
  </p>
</section>

<!-- ============ 紀錄 ============ -->
<section class="view" id="view-log">
  <p class="log-hint">最近的置入／移出／新增／刪除紀錄（最新 120 筆），每筆都記下經手人。</p>
  <select class="logfilter" id="logFilter"><option value="">全部經手人</option></select>
  <div id="logList"></div>
</section>

<nav>
  <button data-view="map" class="on"><b>🧊</b>位置圖</button>
  <button data-view="log"><b>🕒</b>紀錄</button>
</nav>

<!-- ============ 編輯視窗 ============ -->
<div class="mask" id="mask">
  <div class="sheet" id="sheet">
    <h2 id="sheetTitle">新增物品</h2>
    <label style="display:flex;align-items:center;gap:8px">品名 <span style="color:#c9455a">*</span>
      <button type="button" class="btn sm ghost" id="btnVoiceFill" style="margin-left:auto">🎤 用說的</button>
    </label>
    <input type="text" id="fName" placeholder="例：當歸、素排骨、香菇頭">
    <div class="vhint" id="fVoiceHint" style="display:none;margin:7px 0 0"></div>
    <div class="row">
      <div>
        <label>數量</label>
        <div class="stepper">
          <button type="button" id="minus">−</button>
          <input type="number" id="fQty" value="1" min="0" step="1" inputmode="numeric">
          <button type="button" id="plus">＋</button>
        </div>
      </div>
      <div>
        <label>單位</label>
        <select id="fUnit">
          <option>包</option><option>袋</option><option>盒</option><option>罐</option>
          <option>瓶</option><option>斤</option><option>台兩</option><option>份</option><option>個</option>
        </select>
      </div>
    </div>
    <label>經手人（放入／移出者） <span style="color:#c9455a">*</span></label>
    <input type="text" id="fBy" list="byList" autocomplete="off" placeholder="例：陳師姐、林前賢">
    <datalist id="byList"></datalist>
    <label>樓層</label>
    <select id="fFloor"></select>
    <label>備註（選填）</label>
    <input type="text" id="fNote" placeholder="例：2026 年普度用、開封過">
    <div class="acts">
      <button class="btn ghost" id="btnCancel">取消</button>
      <button class="btn ok" id="btnSave">儲存</button>
      <button class="btn danger" id="btnDel" style="display:none">刪除</button>
    </div>
    <div class="tiny" id="metaInfo"></div>
  </div>
</div>

<div id="toast"></div>

<script>window.FIREBASE_CONFIG={
  apiKey: "AIzaSyCRazQsleeTILp7VO5zYbeiy9dtOxrVenc",
  authDomain: "bentodish-alan.firebaseapp.com",
  projectId: "bentodish-alan",
  storageBucket: "bentodish-alan.firebasestorage.app",
  messagingSenderId: "652937239500",
  appId: "1:652937239500:web:2c4c3b28b2311f2b12db69"
};</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot,
         query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { parseUtterance } from "./voice-parse.js";

/* ================= 設定 ================= */
const COLL_ITEMS = "frozen_items";
const COLL_LOG   = "frozen_log";
const FLOORS = [
  { id: 1, name: "中藥區、甜餡料、湯料", door: "上門", key: "U", local: 1, slot: "上格" },
  { id: 2, name: "素料、餡料區", door: "上門", key: "U", local: 2, slot: "下格" },
  { id: 3, name: "素料",         door: "下門", key: "D", local: 1, slot: "上格" },
  { id: 4, name: "其他",         door: "下門", key: "D", local: 2, slot: "下格" }
];
const floorOf = id => FLOORS.find(f => f.id === Number(id)) || { id: Number(id), name: "未指定", door: "", local: Number(id), slot: "" };
const floorLabel = id => { const f = floorOf(id); return f.door ? `${f.door} 第${f.local}層` : `第${f.id}層`; };
const floorFull = id => { const f = floorOf(id); return `${floorLabel(id)} ${f.name}`; };

/* ================= Firebase ================= */
const app  = initializeApp(window.FIREBASE_CONFIG);
const auth = getAuth(app);
const db   = getFirestore(app);
let ready = false, items = [], editId = null, logRows = [], pendingHighlight = null, focusedFloor = null;

/* ================= 小工具 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let toastTimer = null;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 2600);
}
function fmtTime(ms) {
  if (!ms) return "";
  const d = new Date(ms);
  const p = n => String(n).padStart(2, "0");
  const now = new Date();
  const sameYear = d.getFullYear() === now.getFullYear();
  return (sameYear ? "" : d.getFullYear() + "/") + `${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function sync(state, text) {
  const dot = $("#dot");
  dot.className = "dot" + (state === "on" ? " on" : state === "off" ? " off" : "");
  $("#syncTxt").textContent = text;
}

/* ================= 經手人（本機記憶，LINE 內建瀏覽器可能擋 localStorage → 退回記憶體） ================= */
const memStore = {};
const store = {
  get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return memStore[k] || ""; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { memStore[k] = v; } }
};
let operator = store.get("frozen_operator");
function byHistory() {
  const saved = (store.get("frozen_bys") || "").split("|").filter(Boolean);
  const used = items.map(i => i.by).filter(Boolean);
  return Array.from(new Set([...used, ...saved]));
}
function refreshByList() {
  $("#byList").innerHTML = byHistory().map(n => `<option value="${esc(n)}"></option>`).join("");
}
function renderOperator() {
  $("#opName").textContent = operator || "未設定（點右邊設定）";
}
function setOperator(v) {
  operator = (v || "").trim();
  store.set("frozen_operator", operator);
  if (operator) rememberBy(operator);
  renderOperator();
}
function rememberBy(name) {
  if (!name) return;
  const arr = (store.get("frozen_bys") || "").split("|").filter(Boolean);
  if (!arr.includes(name)) arr.unshift(name);
  store.set("frozen_bys", arr.slice(0, 30).join("|"));
  refreshByList();
}
renderOperator();
$("#btnOp").addEventListener("click", () => {
  const v = prompt("請輸入您的姓名（之後每次置入／移出都會記下）：", operator || "");
  if (v !== null) { setOperator(v); toast(operator ? "經手人：" + operator : "已清除經手人"); }
});

/* ================= LINE 掃碼登入（LIFF）：開啟即自動帶入姓名 ================= */
/* 前賢提供 LIFF ID 後填入即可啟用；未填 = 完全不載入外部程式、維持手動輸入姓名 */
const LIFF_ID = "";   // 例："2001234567-abcdefgh"

async function applyLineProfile() {
  try {
    const p = await window.liff.getProfile();
    if (p && p.displayName) {
      setOperator(p.displayName);
      rememberBy(p.displayName);
      toast("LINE 登入：" + p.displayName);
    }
  } catch (e) { console.warn("取得 LINE 資料失敗", e); }
}

async function initLiff() {
  if (!LIFF_ID) return;
  await new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://static.line-scdn.net/liff/edge/2/sdk.js";
    s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
  await window.liff.init({ liffId: LIFF_ID });
  if (window.liff.isLoggedIn()) {
    $("#btnLine").style.display = "none";
    await applyLineProfile();
  } else if (window.liff.isInClient()) {
    window.liff.login();                     // 在 LINE 內開啟 → 直接登入
  } else {
    $("#btnLine").style.display = "";        // 一般瀏覽器 → 給一顆登入鈕
  }
}

$("#btnLine").addEventListener("click", async () => {
  if (!window.liff) { toast("LINE 元件未載入"); return; }
  if (!window.liff.isLoggedIn()) window.liff.login();
  else await applyLineProfile();
});

initLiff().catch(e => console.warn("LIFF 初始化失敗（LIFF ID 未設定或網路問題）", e));

/* LINE 內建瀏覽器提示 */
if (/Line\/|LIFF/i.test(navigator.userAgent)) $("#lineTip").classList.add("on");

/* ================= 登入（匿名，自動） ================= */
sync("", "連線中…");
onAuthStateChanged(auth, user => {
  if (user) { ready = true; sync("on", "已連線・即時同步"); listen(); }
  else {
    signInAnonymously(auth).catch(e => {
      console.error("匿名登入失敗", e);
      sync("off", "離線（僅檢視）");
      toast("無法連線雲端：" + (e && e.code ? e.code : e.message));
    });
  }
});

/* ================= 即時同步 ================= */
let unsubItems = null, unsubLog = null;
function listen() {
  if (unsubItems) return;
  unsubItems = onSnapshot(query(collection(db, COLL_ITEMS), orderBy("name")), snap => {
    items = snap.docs.map(d => Object.assign({ _id: d.id }, d.data()));
    renderMap(); applySearch();
  }, err => { console.error(err); sync("off", "讀取失敗"); toast("讀取失敗：" + err.code); });

  unsubLog = onSnapshot(query(collection(db, COLL_LOG), orderBy("at", "desc"), limit(120)), snap => {
    renderLog(snap.docs.map(d => d.data()));
  }, err => console.error("log", err));
}

/* ================= 位置圖 ================= */
function tierHTML(fid) {
  const f = floorOf(fid);
  const list = items.filter(i => Number(i.floor) === fid);
  const total = list.reduce((s, i) => s + (Number(i.qty) || 0), 0);
  const countTxt = total > 0 ? `${list.length} 項 / 共 ${total}`
                 : list.length ? `${list.length} 項（用完）` : "";
  return `<div class="tier" id="tier-${fid}" data-floor="${fid}" data-door="${f.key}">
      <div class="tier-head">
        <span class="fl-badge">${esc(f.door)} 第${f.local}層</span>
        <span class="fl-name">${esc(f.name)}</span>
        <span class="fl-sub">${esc(f.slot)}</span>
        <span class="fl-count">${countTxt}</span>
      </div>
      <div class="items">
        ${list.length ? list.map(chipHTML).join("") : '<span class="empty">尚無物品</span>'}
      </div>
    </div>`;
}

function renderMap() {
  const box = $("#freezer");
  const doors = [
    { key: "U", label: "上　門", floors: [1, 2] },
    { key: "D", label: "下　門", floors: [3, 4] }
  ];
  box.innerHTML = `
    <div class="fridge-top">
      <span class="vent"></span>
      <span class="panel">-18°C</span>
    </div>
    <div class="doors">
      ${doors.map(d => `
        <section class="door" data-door="${d.key}">
          <div class="hinge h1"></div><div class="hinge h2"></div>
          <div class="door-head">${d.label}</div>
          <div class="shelves">${d.floors.map(tierHTML).join("")}</div>
          <div class="handle"></div>
          <div class="lock"></div>
        </section>`).join("")}
    </div>
    <div class="wheels"><i></i><i></i><i></i><i></i></div>`;

  box.querySelectorAll(".chip").forEach(el => el.addEventListener("click", () => openEdit(el.dataset.id)));
  refreshByList();
  /* 重繪後把焦點框補回來（語音/掃碼指定的樓層） */
  if (focusedFloor != null) {
    const ft = box.querySelector(`.tier[data-floor="${focusedFloor}"]`);
    if (ft) ft.classList.add("focus");
  }
  /* 語音/編輯更新後，讓剛動到的品項閃一下 */
  if (pendingHighlight) {
    const el = box.querySelector(`.chip[data-id="${pendingHighlight}"]`);
    if (el) {
      el.classList.add("hit");
      setTimeout(() => el.classList.remove("hit"), 2600);
      pendingHighlight = null;
    }
  }
}
/* 捲到指定樓層、閃框、保留焦點框 10 秒 */
function focusTier(fid) {
  focusedFloor = Number(fid);
  const el = document.getElementById("tier-" + fid);
  if (!el) return;
  el.scrollIntoView({ behavior: "smooth", block: "center" });
  el.classList.add("focus", "pulse");
  setTimeout(() => el.classList.remove("pulse"), 3600);
  setTimeout(() => {
    const t = document.getElementById("tier-" + fid);
    if (t) t.classList.remove("focus");
    if (focusedFloor === Number(fid)) focusedFloor = null;
  }, 10000);
}
/* 先畫出空冰箱骨架，資料（Firestore）回來再填內容 → 斷線／慢連線時不會整片空白 */
renderMap();

function chipHTML(it) {
  const q = Number(it.qty) || 0;
  const u = esc(it.unit || "");
  /* 數量 1 不標示（大部分都是一包）；0 標「用完」；2 以上才寫數量 */
  const qtyBadge = q < 1 ? `<span class="q">用完</span>`
                 : q > 1 ? `<span class="q">${q}${u ? " " + u : ""}</span>` : "";
  return `<button class="chip${q < 1 ? " low" : ""}" data-id="${esc(it._id)}" data-name="${esc(it.name)}"
      title="${esc([it.name, q + (it.unit || ""), it.note ? "備註：" + it.note : "", it.by ? "放入：" + it.by : "", it.updatedAt ? "更新：" + fmtTime(it.updatedAt) : ""].filter(Boolean).join("　"))}">
      <span class="nm">${esc(it.name)}</span>
      ${qtyBadge}
      ${it.by ? `<span class="by">👤${esc(it.by)}</span>` : ""}
    </button>`;
}

/* ================= 搜尋 ================= */
function applySearch() {
  const kw = ($("#search").value || "").trim().toLowerCase();
  document.querySelectorAll(".chip").forEach(el => el.classList.remove("hit"));
  if (!kw) { $("#searchInfo").textContent = ""; return; }
  let hits = 0, floors = new Set();
  document.querySelectorAll(".chip").forEach(el => {
    const hit = (el.dataset.name || "").toLowerCase().includes(kw);
    if (hit) { el.classList.add("hit"); hits++; floors.add(el.closest(".tier").dataset.floor); }
  });
  $("#searchInfo").textContent = hits
    ? `找到 ${hits} 項，位於：` + [...floors].sort().map(f => `${floorLabel(f)} ${floorOf(f).name}`).join("、")
    : "查無此品名";
}
$("#search").addEventListener("input", applySearch);

/* ================= 樓層選擇器 ================= */
$("#fFloor").innerHTML = FLOORS.map(f => `<option value="${f.id}">${f.door} 第${f.local}層 — ${f.name}</option>`).join("");

/* ================= 編輯視窗 ================= */
function openEdit(id, presetFloor) {
  stopListen();                                  // 開編輯視窗時先關掉主頁語音，避免搶麥克風
  if (fillRec) { try { fillRec.stop(); } catch (_) {} }
  $("#fVoiceHint").style.display = "none";
  $("#fVoiceHint").textContent = "";
  $("#btnVoiceFill").textContent = "🎤 用說的";
  editId = id || null;
  const it = id ? items.find(i => i._id === id) : null;
  $("#sheetTitle").textContent = it ? "修改物品" : "新增物品";
  $("#fName").value  = it ? it.name : "";
  $("#fQty").value   = it ? (Number(it.qty) || 0) : 1;
  $("#fUnit").value  = it && it.unit ? it.unit : "包";
  $("#fFloor").value = String(it ? Number(it.floor) : (presetFloor || FLOORS[0].id));
  $("#fNote").value  = it && it.note ? it.note : "";
  $("#fBy").value    = it && it.by ? it.by : operator;
  $("#btnDel").style.display = it ? "" : "none";
  refreshByList();
  $("#metaInfo").textContent = it
    ? `上次更新：${fmtTime(it.updatedAt)}${it.by ? "　登錄者：" + it.by : ""}`
    : "";
  $("#mask").classList.add("on");
  setTimeout(() => $("#fName").focus(), 120);
}
function closeEdit() { $("#mask").classList.remove("on"); editId = null; }
$("#btnCancel").addEventListener("click", closeEdit);
$("#mask").addEventListener("click", e => { if (e.target.id === "mask") closeEdit(); });
$("#minus").addEventListener("click", () => { const q = $("#fQty"); q.value = Math.max(0, (Number(q.value) || 0) - 1); });
$("#plus").addEventListener("click",  () => { const q = $("#fQty"); q.value = (Number(q.value) || 0) + 1; });
$("#btnAdd").addEventListener("click", () => openEdit(null));

/* ================= 寫入資料 ================= */
function needReady() {
  if (!ready) { toast("尚未連上雲端，請稍後再試"); return false; }
  return true;
}

$("#btnSave").addEventListener("click", async () => {
  if (!needReady()) return;
  const name = ($("#fName").value || "").trim();
  const qty  = Math.max(0, Number($("#fQty").value) || 0);
  const unit = $("#fUnit").value;
  const floor = Number($("#fFloor").value);
  const note = ($("#fNote").value || "").trim();
  const by   = ($("#fBy").value || "").trim();
  if (!name) { toast("請輸入品名"); return; }
  if (!by)   { toast("請填經手人（放入／移出者）"); $("#fBy").focus(); return; }
  setOperator(by); rememberBy(by);

  $("#btnSave").disabled = true;
  try {
    if (editId) {
      const old = items.find(i => i._id === editId) || {};
      await updateDoc(doc(db, COLL_ITEMS, editId), {
        name, qty, unit, floor, note, by, updatedAt: Date.now()
      });
      const diff = qty - (Number(old.qty) || 0);
      if (diff !== 0) await addLog(floor, name, Math.abs(diff), unit, diff > 0 ? "in" : "out", by);
      else await addLog(floor, name, qty, unit, "edit", by);
      toast("已更新：" + name);
    } else {
      await addDoc(collection(db, COLL_ITEMS), {
        name, qty, unit, floor, note, by, updatedAt: Date.now(), createdAt: Date.now()
      });
      await addLog(floor, name, qty, unit, "new", by);
      toast("已新增：" + name);
    }
    closeEdit();
  } catch (e) {
    console.error(e);
    toast("寫入失敗：" + (e.code || e.message));
  } finally { $("#btnSave").disabled = false; }
});

$("#btnDel").addEventListener("click", async () => {
  if (!editId || !needReady()) return;
  const it = items.find(i => i._id === editId) || {};
  if (!confirm(`確定刪除「${it.name}」？\n（紀錄會保留一筆刪除記錄）`)) return;
  const by = ($("#fBy").value || "").trim() || operator;
  if (!by) { toast("請填經手人（放入／移出者）"); $("#fBy").focus(); return; }
  setOperator(by); rememberBy(by);
  try {
    await deleteDoc(doc(db, COLL_ITEMS, editId));
    await addLog(Number(it.floor), it.name, Number(it.qty) || 0, it.unit || "", "del", by);
    toast("已刪除：" + it.name);
    closeEdit();
  } catch (e) { toast("刪除失敗：" + (e.code || e.message)); }
});

async function addLog(floor, name, qty, unit, action, by) {
  try {
    await addDoc(collection(db, COLL_LOG), {
      floor: Number(floor), name, qty, unit, action, by: by || "", at: Date.now()
    });
  } catch (e) { console.warn("紀錄寫入失敗", e); }
}

/* ================= 紀錄頁 ================= */
const ACT = {
  in:   { ic: "⬇️", txt: "置入", cls: "badge-in" },
  out:  { ic: "⬆️", txt: "移出", cls: "badge-out" },
  new:  { ic: "🆕", txt: "新增", cls: "badge-in" },
  del:  { ic: "🗑️", txt: "刪除", cls: "badge-out" },
  edit: { ic: "✏️", txt: "修改", cls: "" }
};
function renderLog(rows) {
  logRows = rows || [];
  const who = $("#logFilter").value;
  const names = Array.from(new Set(logRows.map(r => r.by).filter(Boolean)));
  const cur = $("#logFilter").value;
  $("#logFilter").innerHTML = '<option value="">全部經手人</option>' +
    names.map(n => `<option value="${esc(n)}"${n === cur ? " selected" : ""}>${esc(n)}</option>`).join("");

  const list = who ? logRows.filter(r => r.by === who) : logRows;
  $("#logList").innerHTML = list.length ? list.map(r => {
    const a = ACT[r.action] || ACT.edit;
    const f = floorOf(r.floor);
    return `<div class="logitem">
      <div class="ic">${a.ic}</div>
      <div class="body">
        <div class="t1"><span class="${a.cls}">${a.txt}</span>　${esc(r.name)}　${Number(r.qty) || 0} ${esc(r.unit || "")}</div>
        <div class="t2">${esc(floorLabel(r.floor))} ${esc(f.name)}　·　👤 ${esc(r.by || "未記錄")}　·　${fmtTime(r.at)}</div>
      </div></div>`;
  }).join("") : '<p class="log-hint">沒有符合的紀錄。</p>';
}
$("#logFilter").addEventListener("change", () => renderLog(logRows));

/* ================= 語音記帳（講一句 → 確認卡按一下 → 寫入） ================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, wakeLock = null, pendingVoice = null;

function vState(txt, live) {
  $("#vState").textContent = txt;
  $("#vDot").classList.toggle("live", !!live);
}
async function keepAwake(on) {
  try {
    if (on && "wakeLock" in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { /* 不支援就算了 */ }
}
function startListen() {
  if (!SR) { toast("此瀏覽器不支援語音辨識，請用 Android Chrome 開啟"); return; }
  if (listening) return;
  listening = true;
  rec = new SR();
  rec.lang = "zh-TW"; rec.continuous = true; rec.interimResults = true; rec.maxAlternatives = 1;
  rec.onstart = () => vState("聽取中…請講「品名＋數量」", true);
  rec.onresult = e => {
    let interim = "", final = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) final += r[0].transcript; else interim += r[0].transcript;
    }
    if (interim || final.trim()) $("#vHeard").hidden = false;
    if (interim) $("#vHeard").innerHTML = "…" + esc(interim);
    if (final.trim()) { $("#vHeard").innerHTML = "<b>" + esc(final.trim()) + "</b>"; handleVoice(final.trim()); }
  };
  rec.onerror = e => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      listening = false; keepAwake(false); vState("麥克風未授權", false);
      toast("請允許麥克風權限後再按「開始聽」");
    } else if (e.error !== "no-speech" && e.error !== "aborted") { console.warn("語音錯誤:", e.error); }
  };
  rec.onend = () => { if (listening) { try { rec.start(); } catch (_) {} } else vState("已停止", false); };
  try { rec.start(); keepAwake(true); } catch (e) { listening = false; toast("無法啟動語音：" + e.message); }
}
function stopListen() {
  listening = false;
  if (rec) { try { rec.stop(); } catch (_) {} }
  keepAwake(false); vState("已停止", false);
}

function handleVoice(text) {
  if (/^(停止|結束|不要聽|關掉)/.test(text)) { stopListen(); toast("已停止聽取"); return; }
  const r = parseUtterance(text, items);
  if (r.operatorName) { setOperator(r.operatorName); toast("經手人：" + r.operatorName); }
  pendingVoice = r;
  renderVoiceCard(r);
}

function renderVoiceCard(r) {
  const box = $("#vCard");
  const isIn = r.action === "in";
  if (!r.name) {
    pendingVoice = null;
    box.innerHTML = `<div class="vcard warn"><div class="big">🤔 沒聽清楚</div>
      <div class="sub">只聽到：「${esc(r.raw)}」<br>請再講一次，例如「香菇頭 一包」。</div></div>`;
    return;
  }
  if (!r.match || r.score < 45) {
    box.innerHTML = `<div class="vcard warn">
      <div class="big">❓ 找不到「<span class="nm">${esc(r.name)}</span>」</div>
      <div class="sub">這個品項還沒建過。要新增就按下面，或按取消再講一次。</div>
      <div class="acts">
        <button class="btn ghost" id="vCancel">取消</button>
        <button class="btn" id="vCreate">＋ 新增這個品項</button>
      </div></div>`;
    $("#vCancel").addEventListener("click", () => { pendingVoice = null; box.innerHTML = ""; $("#vHeard").hidden = true; });
    $("#vCreate").addEventListener("click", voiceCreate);
    return;
  }
  const it = r.match;
  const cur = Number(it.qty) || 0;
  const after = Math.max(0, cur + (isIn ? r.qty : -r.qty));
  const f = floorOf(it.floor);
  const floorWarn = (r.floor && Number(r.floor) !== Number(it.floor))
    ? `<br><span style="color:#c9455a">⚠️ 你講的是 ${esc(floorLabel(r.floor))}，但這個品項記在 ${esc(floorLabel(it.floor))}</span>` : "";
  box.innerHTML = `<div class="vcard">
    <div class="big">${isIn ? "⬇️ 置入" : "⬆️ 移出"}　<span class="nm">${esc(it.name)}</span>　${r.qty}${esc(r.unit || it.unit || "")}</div>
    <div class="sub">目前庫存：${cur}${esc(it.unit || "")} → <b>${after}${esc(it.unit || "")}</b>　·　${esc(floorLabel(it.floor))} ${esc(f.name)}${floorWarn}</div>
    <label>經手人</label>
    <input type="text" id="vBy" list="byList" value="${esc(operator)}" placeholder="例：陳師姐">
    <div class="acts">
      <button class="btn ghost" id="vCancel">取消</button>
      <button class="btn ok" id="vOk">✅ 確認</button>
    </div>
    <div class="tiny">聽到：「${esc(r.raw)}」</div></div>`;
  refreshByList();
  $("#vCancel").addEventListener("click", () => { pendingVoice = null; box.innerHTML = ""; });
  $("#vOk").addEventListener("click", confirmVoice);
}

function voiceCreate() {
  const r = pendingVoice;
  if (!r) return;
  openEdit(null, r.floor || 1);
  setTimeout(() => {
    $("#fName").value = r.name;
    $("#fQty").value = r.qty || 1;
    if (r.unit) $("#fUnit").value = r.unit;
  }, 80);
  $("#vCard").innerHTML = "";
}

async function confirmVoice() {
  const r = pendingVoice;
  if (!r || !r.match || !needReady()) return;
  const by = ($("#vBy").value || "").trim();
  if (!by) { toast("請填經手人"); $("#vBy").focus(); return; }
  setOperator(by); rememberBy(by);
  const it = r.match;
  const isIn = r.action === "in";
  const newQty = Math.max(0, (Number(it.qty) || 0) + (isIn ? r.qty : -r.qty));
  $("#vOk").disabled = true;
  try {
    await updateDoc(doc(db, COLL_ITEMS, it._id), { qty: newQty, by, updatedAt: Date.now() });
    await addLog(Number(it.floor), it.name, r.qty, r.unit || it.unit || "", r.action, by);
    toast(`已${isIn ? "置入" : "移出"}：${it.name} ${r.qty}${r.unit || it.unit || ""}`);
    pendingVoice = null;
    $("#vCard").innerHTML = "";
    $("#vHeard").hidden = true;
    /* 直接反映在冷凍格層：捲到該層、品項閃一下 */
    pendingHighlight = it._id;
    focusTier(it.floor);
    setTimeout(() => { if (pendingHighlight) renderMap(); }, 900);
  } catch (e) {
    console.error(e);
    toast("寫入失敗：" + (e.code || e.message));
  } finally { if ($("#vOk")) $("#vOk").disabled = false; }
}

$("#btnListen").addEventListener("click", startListen);
$("#btnStop").addEventListener("click", stopListen);
window.addEventListener("pagehide", stopListen);
vState(SR ? "語音未啟動（按「開始聽」）" : "此瀏覽器不支援語音（請用 Android Chrome）", false);

/* ================= 新增／修改視窗：用語音填欄位 ================= */
let fillRec = null, fillListening = false;

function applyVoiceToForm(text) {
  const r = parseUtterance(text, items);
  const sel = $("#fUnit");
  const hasUnit = u => [...sel.options].some(o => o.value === u);
  if (r.name) $("#fName").value = r.name;
  if (r.qty > 0) $("#fQty").value = r.qty;
  if (r.unit && hasUnit(r.unit)) sel.value = r.unit;
  if (r.floor) $("#fFloor").value = String(r.floor);
  if (r.operatorName) $("#fBy").value = r.operatorName;
  const parts = [];
  if (r.name) parts.push("品名「" + r.name + "」");
  if (r.qty) parts.push("數量 " + r.qty + (r.unit && hasUnit(r.unit) ? r.unit : ""));
  if (r.floor) parts.push("樓層 " + floorLabel(r.floor));
  if (r.match) parts.push("（已有品項：" + r.match.name + "）");
  $("#fVoiceHint").textContent = parts.length ? "✅ 已填入：" + parts.join("、") : "沒聽清楚，請再講一次";
}

function toggleVoiceFill() {
  if (!SR) { toast("此瀏覽器不支援語音辨識，請用 Android Chrome 開啟"); return; }
  if (fillListening) { try { fillRec.stop(); } catch (_) {} return; }
  stopListen();                              // 避免與主頁語音搶麥克風
  fillListening = true;
  $("#btnVoiceFill").textContent = "🎤 聽取中…";
  $("#fVoiceHint").style.display = "";
  $("#fVoiceHint").textContent = "請講「品名＋數量」，例如：香菇頭兩包";
  fillRec = new SR();
  fillRec.lang = "zh-TW"; fillRec.continuous = false; fillRec.interimResults = true; fillRec.maxAlternatives = 1;
  fillRec.onresult = e => {
    let interim = "", final = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) final += r[0].transcript; else interim += r[0].transcript;
    }
    if (interim && !final) $("#fVoiceHint").textContent = "…" + interim;
    if (final.trim()) applyVoiceToForm(final.trim());
  };
  fillRec.onerror = e => {
    fillListening = false; $("#btnVoiceFill").textContent = "🎤 用說的";
    if (e.error === "not-allowed" || e.error === "service-not-allowed") toast("請允許麥克風權限");
  };
  fillRec.onend = () => { fillListening = false; $("#btnVoiceFill").textContent = "🎤 用說的"; };
  try { fillRec.start(); } catch (e) { fillListening = false; $("#btnVoiceFill").textContent = "🎤 用說的"; toast("無法啟動語音：" + e.message); }
}

$("#btnVoiceFill").addEventListener("click", toggleVoiceFill);

/* ================= 分頁切換 ================= */
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "view-" + b.dataset.view));
  window.scrollTo({ top: 0, behavior: "smooth" });
}));

/* ?tab=xxx 直接開指定分頁（門邊平板固定用 ?tab=voice） */
const tabParam = new URLSearchParams(location.search).get("tab");
const tabBtn = tabParam ? document.querySelector(`nav button[data-view="${tabParam}"]`) : null;
if (tabBtn) tabBtn.click();

/* ================= 掃碼直達 ?f=N ================= */
function gotoFloor(fid) {
  const f = floorOf(fid);
  if (!FLOORS.some(x => x.id === Number(fid))) return;
  const bar = $("#focusBar");
  bar.style.display = "";
  bar.innerHTML = `📍 掃碼指定：<b>${esc(floorLabel(fid))} — ${esc(f.name)}</b>（${esc(f.slot)}）`;
  setTimeout(() => focusTier(fid), 400);
}
const m = new URLSearchParams(location.search).get("f");
if (m) gotoFloor(m);

/* 首次渲染後若有 ?f= 再次定位（等資料進來） */
setTimeout(() => { if (m) gotoFloor(m); }, 2500);
</script>
