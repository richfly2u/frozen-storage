<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#0b4b6b">
<title>凱德佛堂 冷凍庫 物品位置管理</title>
<style>
:root{
  --ice:#f2f9fe; --line:#cfe4f2; --deep:#0b4b6b; --accent:#1e88c7;
  --ok:#178f60; --warn:#c9861a; --danger:#c9455a; --txt:#12313f; --muted:#6a8a9c;
  --card:#ffffff; --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:#eef6fb; color:var(--txt); padding-bottom:16px; font-size:16px;
}
/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:20; background:linear-gradient(160deg,#0b4b6b,#1a7ba8);
  color:#fff; padding:12px 14px 14px; box-shadow:0 3px 14px rgba(11,75,107,.25);
}
.hrow{display:flex;align-items:center;gap:8px}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.5px;flex:1}
.dot{width:9px;height:9px;border-radius:50%;background:var(--warn);flex:0 0 auto;box-shadow:0 0 0 3px rgba(255,255,255,.18)}
.dot.on{background:#4fd39a}.dot.off{background:#ff8a8a}
#syncTxt{font-size:12px;opacity:.9;margin-left:6px;white-space:nowrap}
#search{
  margin-top:10px;width:100%;border:none;border-radius:10px;padding:10px 12px;font-size:15px;
  background:rgba(255,255,255,.94);color:#12313f;
}
#search::placeholder{color:#8aa6b5}
.searchinfo{font-size:12.5px;margin-top:6px;color:#dff0fa;min-height:0}
/* ---------- tabs ---------- */
nav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:#fff;
  border-top:1px solid var(--line);box-shadow:0 -3px 14px rgba(11,75,107,.10);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1;border:none;background:none;padding:10px 4px 12px;font-size:12.5px;color:var(--muted);
  font-family:inherit;cursor:pointer;line-height:1.5
}
nav button b{display:block;font-size:19px;font-weight:400;filter:grayscale(1);opacity:.6}
nav button.on{color:var(--deep);font-weight:700}
nav button.on b{filter:none;opacity:1}
/* ---------- views ---------- */
.view{display:none;padding:12px}
.view.on{display:block}
.legend{font-size:12.5px;color:var(--muted);margin:0 2px 10px;line-height:1.6}
/* ---------- 商用不鏽鋼雙門冰櫃（上下門、玻璃門片） ---------- */
.freezer{
  max-width:480px;margin:0 auto;padding:10px 12px 0;
  background:linear-gradient(180deg,#eef2f5,#c8d3db);
  border:2px solid #b6c3ce;border-radius:16px 16px 8px 8px;
  box-shadow:0 12px 28px rgba(18,38,56,.20),inset 0 1px 0 #fff
}
.doors{display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:14px;padding-right:28px}
.door{
  position:relative;border-radius:12px;padding:9px 11px 0;min-width:0;
  background:linear-gradient(165deg,rgba(232,245,255,.62),rgba(198,224,243,.40));
  border:3px solid #c6d2db;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),0 3px 10px rgba(18,38,56,.14)
}
/* 上下門色系區隔：上門＝藍、下門＝綠 */
.door[data-door="U"]{
  background:linear-gradient(165deg,rgba(228,243,255,.74),rgba(184,219,244,.46));
  border-color:#b3cde4;box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),0 3px 10px rgba(20,80,130,.16)
}
.door[data-door="D"]{
  background:linear-gradient(165deg,rgba(229,249,240,.74),rgba(183,229,211,.46));
  border-color:#abcbbd;box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),0 3px 10px rgba(16,90,70,.16)
}
.door::before{
  content:"";position:absolute;inset:0;border-radius:9px;pointer-events:none;opacity:.5;z-index:0;
  background:linear-gradient(115deg,rgba(255,255,255,.8) 0 9%,rgba(255,255,255,0) 30% 100%)
}
/* 把手：凸出於門外的握把＋兩支連接支架（避免被誤認為捲軸） */
.door .handle{
  position:absolute;top:50%;right:-24px;transform:translateY(-50%);width:13px;height:32%;border-radius:7px;z-index:2;
  background:linear-gradient(90deg,#7b8891,#333c43 45%,#0a0e11);
  box-shadow:4px 3px 9px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.18)
}
.door .handle::before,.door .handle::after{
  content:"";position:absolute;right:11px;width:16px;height:8px;border-radius:2px;
  background:linear-gradient(180deg,#96a3ac,#5b666e);box-shadow:0 1px 2px rgba(0,0,0,.35)
}
.door .handle::before{top:4px}
.door .handle::after{bottom:4px}
/* 門鉸鏈 */
.door .hinge{
  position:absolute;left:-9px;width:10px;height:26px;border-radius:3px 0 0 3px;z-index:0;
  background:linear-gradient(180deg,#e3eaee,#98a5ae);box-shadow:0 1px 3px rgba(0,0,0,.3)
}
.door .hinge.h1{top:20%}
.door .hinge.h2{bottom:20%}
/* 門鎖（門右上角） */
.door .lock{
  position:absolute;top:9px;right:14px;width:13px;height:13px;border-radius:3px;z-index:2;
  background:linear-gradient(180deg,#454f57,#1b2126);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),0 1px 2px rgba(0,0,0,.4)
}
.door .lock::after{
  content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:4px;height:6px;border-radius:2px;background:#0a0e11
}
.shelves{position:relative;z-index:1;display:grid;grid-auto-rows:auto;
  gap:6px;min-width:0;padding-top:3px;padding-bottom:0}
.tier{
  position:relative;margin:0;padding:6px 5px 18px;min-width:0;display:flex;flex-direction:column;
  aspect-ratio:4 / 3;   /* 高:寬 = 3:4 */
  background:transparent;border:none;transition:box-shadow .25s,transform .25s
}
/* 層架橫槓（不鏽鋼前緣）：下門最下層會切齊門的底緣 */
.tier::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:13px;border-radius:3px 3px 2px 2px;
  background:linear-gradient(180deg,#ffffff 0%,#eaf0f5 42%,#bcc9d4 100%);
  box-shadow:0 1px 2px rgba(0,0,0,.18),inset 0 -1px 0 rgba(255,255,255,.7)
}
/* 層數：顯示在橫槓正中間 */
.tier-no{
  position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);z-index:3;pointer-events:none;
  font-size:11.5px;font-weight:700;line-height:1;letter-spacing:.5px;color:#2b4356;white-space:nowrap;
  background:linear-gradient(180deg,#ffffff,#e7eff5);border:1px solid #b6c4d0;border-radius:8px;
  padding:3px 9px;box-shadow:0 1px 2px rgba(0,0,0,.16)
}
/* 每扇門最下層的橫槓切齊門的底緣：把最下層「壓」到門框底線上，橫槓就貼住冰箱底 */
.door .tier:last-child{margin-bottom:-3px}
.door .tier:last-child::after{bottom:0;border-radius:3px 3px 8px 8px}
@media (max-width:520px){
  .freezer{padding:8px 9px 0;border-radius:14px 14px 6px 6px}
  .doors{gap:10px;padding-right:22px}
  .door{padding:8px 10px 0;border-width:2px}
  .door .handle{width:11px;right:-19px}
  .door .handle::before,.door .handle::after{width:13px;height:7px;right:9px}
  .door .hinge{left:-7px;width:8px;height:20px}
  .door .lock{top:7px;right:11px;width:11px;height:11px}
  .shelves{padding-top:3px}
  .tier{padding:5px 4px 18px}
  .tier-no{font-size:10.5px;padding:2px 7px}
  .fl-name{font-size:14px}
  .tier-head{gap:5px}
  h1{font-size:15px;letter-spacing:0}
  #syncTxt{font-size:11.5px}
  .hrow{gap:6px}
  .items{flex-direction:column;gap:6px}
  .chip{width:100%;gap:6px;flex-wrap:wrap}
  .chip .nm{max-width:none;flex:1 1 auto}
  .chip .by{flex:1 0 100%;margin-top:1px}
}
.tier.focus{box-shadow:0 0 0 3px rgba(30,136,199,.35);transform:scale(1.012)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(30,136,199,.30)}50%{box-shadow:0 0 0 9px rgba(30,136,199,.14)}}
.tier.pulse{animation:pulse 1.1s ease-in-out 3}
.tier-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.fl-name{font-weight:700;font-size:15.5px;overflow-wrap:anywhere;min-width:0}
.fl-count{margin-left:auto;font-size:12.5px;color:var(--accent);font-weight:700}
.items{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:10px;min-width:0}
.items .empty{font-size:13px;color:#9db4c2;padding:4px 2px}
.chip{
  border:1px solid #cfe6f4;background:#f0f8fe;border-radius:11px;padding:7px 10px;
  font-family:inherit;font-size:14px;color:var(--txt);cursor:pointer;display:inline-flex;
  align-items:center;gap:7px;max-width:100%;min-width:0
}
.chip:active{transform:scale(.97)}
.chip .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw;min-width:0}
.chip .q{background:#1e88c7;color:#fff;border-radius:7px;font-size:12.5px;padding:1px 7px;white-space:nowrap;font-weight:700}
.chip.low .q{background:var(--danger)}
.chip .nt{font-size:11.5px;color:var(--muted)}
.chip.hit{outline:3px solid #ffcf70;background:#fff8e6}
/* ---------- 就地操作（拖曳換層／⋯選單） ---------- */
.chip .more{
  display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;flex:0 0 auto;
  margin:-2px -4px -2px 0;border-radius:7px;color:#5c7f97;background:rgba(30,136,199,.10);
  font-size:15px;line-height:1;font-weight:700
}
.chip .more:hover{background:rgba(30,136,199,.22)}
.chip{touch-action:pan-y}
.chip.dragging{opacity:.32}
.chip-ghost{
  position:fixed;z-index:90;pointer-events:none;transform:translate(-50%,-50%) scale(1.05);
  background:#1e88c7;color:#fff;border-radius:10px;padding:6px 11px;font-size:13.5px;font-weight:600;
  box-shadow:0 8px 22px rgba(10,40,70,.35);white-space:nowrap
}
.tier.drop{box-shadow:inset 0 0 0 3px #2f9e6b;border-radius:12px;background:rgba(47,158,107,.07)}
/* ---------- 版面：左邊冰箱、右邊食材庫（便當組合模式） ---------- */
.mapmain{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.outside{
  border:2px dashed #b9cddb;border-radius:13px;padding:9px 10px;background:rgba(255,255,255,.75);
  display:flex;flex-direction:column;min-height:110px
}
.outside .os-head{font-size:13.5px;font-weight:700;color:#41586a}
.outside .os-hint{font-size:11.5px;color:#7b93a4;margin-top:3px;line-height:1.5}
.outside #osClear{margin-top:auto;border:1px solid #cfe0eb;background:#fff;color:#4a6a80;border-radius:8px;
  padding:5px 10px;font-size:12px;font-family:inherit;cursor:pointer}
.outside .os-items{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0;min-height:30px}
.outside .os-items .empty{font-size:13px;color:#9db4c2;padding:4px 2px}
.outside.over{border-color:#2f9e6b;background:rgba(47,158,107,.12)}
/* 食材庫：小方形格子（同樣空間可以放更多品項） */
.os-chip{background:#fff6e8;border-color:#efd0a4;position:relative;width:100%;max-width:none;
  aspect-ratio:1 / 1;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  text-align:center;font-size:11.5px;line-height:1.18;padding:3px;border-radius:9px;overflow-wrap:anywhere}
.os-chip .q{background:#1e88c7;color:#fff;border-radius:6px;padding:0 3px;font-size:10px;line-height:1.5;margin:0}
.os-chip .more{position:absolute;right:2px;top:2px;width:15px;height:15px;font-size:11px;line-height:1;margin:0}
.os-chip.staple{background:#eef7fd;border-color:#c9e2f2;color:#1a5c8c}
.os-chip.sel{outline:3px solid #2f9e6b;outline-offset:1px;background:#e8f8f0;border-color:#8fd3b4}
.outside #btnAdd{margin-bottom:9px;background:#1e88c7;color:#fff;border:none}
/* ---------- 左欄面板（桌機把搜尋／經手人／說明／語音收到側邊，不佔冰箱上下高度） ---------- */
.side{
  display:flex;flex-direction:column;gap:8px;min-width:0;
  background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 11px 13px;
  box-shadow:0 4px 14px rgba(18,38,56,.08)
}
.side #search{margin:0;border:1px solid #cfe0eb;background:#fff;color:#12313f;font-size:14px;padding:8px 10px;border-radius:9px}
.side .searchinfo{color:var(--muted);margin:0;min-height:0}
.side .opbar{margin:0;color:#41586a;flex-wrap:wrap}
.side .opbar b{color:#12486b;background:#e7f2fa}
.side .opbar button{border-color:#cfe0eb;background:#f6fafd;color:#2b5a76}
.bytoggle{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#41586a;cursor:pointer;user-select:none;margin:0}
.bytoggle small{color:#8fa8b8;font-size:11px}
.bytoggle input{width:15px;height:15px;accent-color:#1e88c7;flex:0 0 auto}
.side .bytip{color:#5a4a2a;background:#fdf5e6;margin:0}
.side .bytip a{color:#0b4b6b}
.side .legend{margin:0;font-size:12.5px;line-height:1.6}
.side .voice-bar{margin:0;flex-wrap:wrap}
.side .voice-bar #vState{flex:1 1 100%}
.side .vhint{margin:0;font-size:12px}
.side .vcard{padding:11px;margin:0}
.side .vcard .big{font-size:17px}
.side .vcard .acts{display:flex;gap:6px;flex-wrap:wrap}
.side .vcard .acts .btn{flex:1 1 auto}
/* 桌機／平板：左欄說明、中間冰箱、右欄食材庫，並把冰箱壓到一頁裝得下 */
@media (min-width:760px){
  .mapmain{grid-template-columns:236px minmax(0,1fr) 330px;gap:11px;align-items:stretch}
  .side{grid-column:1;align-self:start}
  .freezer{grid-column:2;order:0}
  .outside{grid-column:3;order:0}
  .outside{height:calc(100vh - 92px)}
  /* 食材庫：像便當組合那樣排成多欄小格，全部攤開、不用捲 */
  .outside .os-items{flex:1;min-height:0;display:grid;align-content:start;gap:6px;
    grid-template-columns:repeat(auto-fill,minmax(68px,1fr));overflow:visible}
  .os-chip{width:auto;justify-content:center;text-align:center;font-size:12px;line-height:1.3;padding:6px 5px}
  .freezer{height:calc(100vh - 92px);min-height:400px;display:flex;flex-direction:column}
  .freezer{max-width:none}
  .freezer .doors{display:flex;flex-direction:column;flex:1;min-height:0;gap:8px}
  .freezer .door{flex:1 1 0;display:flex;flex-direction:column;min-height:0;padding:6px 10px 0}
  .freezer .shelves{flex:1;min-height:0;grid-auto-rows:minmax(50px,1fr);gap:5px;padding-top:3px}
  .freezer .tier{aspect-ratio:auto;min-height:0;overflow:hidden;padding:2px 4px 18px}
  .freezer .tier .items{overflow:auto;align-content:flex-start}
  .freezer .chip{padding:4px 7px;font-size:12.5px;gap:5px;border-radius:8px}
  .freezer .tier-head{font-size:11px}
  /* 省高度：說明文字與多餘留白在桌機收掉／縮小 */
  .vhint{display:none}
  header{padding:8px 14px 10px}
  h1{font-size:17px}
  #search{margin-top:7px;padding:8px 12px}
  nav button{padding:7px 4px 9px}
  nav button b{font-size:17px}
  body{padding-bottom:16px}
}
/* 矮螢幕（筆電 768 高）：把高度讓給層架 */
@media (min-width:760px) and (max-height:820px){
  .freezer .shelves{gap:4px}
}
/* 手機：冰箱在最上面吃滿高度；食材庫固定在畫面底部（橫向滑），兩者同屏才好拖 */
@media (max-width:759px){
  .freezer{order:-3;max-width:none;height:calc(100vh - 256px);min-height:340px;display:flex;flex-direction:column}
  .freezer .doors{display:flex;flex-direction:column;flex:1;min-height:0;gap:7px}
  .freezer .door{flex:1 1 0;display:flex;flex-direction:column;min-height:0;padding:5px 9px 0}
  .freezer .shelves{flex:1;min-height:0;grid-auto-rows:minmax(44px,1fr);gap:4px;padding-top:3px}
  .freezer .tier{aspect-ratio:auto;min-height:0;overflow:hidden;padding:2px 4px 18px}
  .freezer .tier .items{overflow:auto;align-content:flex-start}

  /* 食材庫：固定底部橫條 */
  .outside{order:0;position:fixed;left:0;right:0;bottom:0;z-index:28;margin:0;padding:7px 9px 9px;
    max-height:132px;border-radius:15px 15px 0 0;border:2px solid #b9cddb;border-bottom:none;
    background:rgba(255,255,255,.97);box-shadow:0 -4px 16px rgba(18,38,56,.14);display:flex;flex-direction:column}
  .outside .os-head{font-size:12px}
  .outside #btnAdd{margin:0;position:absolute;right:9px;top:6px;width:auto;padding:3px 9px;font-size:12px;border-radius:8px}
  .outside #osClear{display:none}
  .outside .os-items{display:flex;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;gap:6px;margin:6px 0 0;
    padding-bottom:2px;scrollbar-width:thin}
  .outside .os-chip{flex:0 0 auto;width:62px;height:62px;font-size:11px;padding:2px}
  .outside .os-chip .more{width:18px;height:18px;font-size:13px}
  .side{order:-1;margin-bottom:126px}
  .vfrow #vState{max-width:76px}
  body{padding-bottom:132px}
  #toast{bottom:142px}   /* 提示要浮在底部食材庫上面，不能被蓋住 */
  /* 選了食材、等使用者點樓層時的提示 */
  .tier.awaitDrop{outline:3px dashed #2f9e6b;outline-offset:2px;background:rgba(47,158,107,.10);cursor:pointer}
}
#dropOut{
  position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:88;pointer-events:none;
  display:none;align-items:center;gap:8px;background:#1e88c7;color:#fff;border-radius:15px;
  padding:13px 20px;font-size:14.5px;font-weight:700;border:3px dashed rgba(255,255,255,.7);
  box-shadow:0 10px 26px rgba(10,40,70,.35)
}
#dropOut.on{display:flex}
#dropOut.over{background:#2f9e6b;transform:translateX(-50%) scale(1.07)}
.cmenu{
  position:fixed;z-index:95;background:#fff;border:1px solid #d7e3ec;border-radius:12px;padding:7px;
  box-shadow:0 12px 34px rgba(18,38,56,.28);min-width:168px;max-width:82vw;
  display:flex;flex-direction:column;gap:4px;font-family:inherit
}
.cmenu .cm-h{font-size:13.5px;font-weight:700;color:#20455e;padding:3px 6px 5px;border-bottom:1px solid #eef4f8;margin-bottom:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmenu button{
  border:none;background:transparent;text-align:left;font-family:inherit;font-size:14px;color:#26384a;
  padding:8px 9px;border-radius:8px;cursor:pointer
}
.cmenu button:hover{background:#f1f7fb}
.cmenu button.danger{color:#c9455a}
.cmenu button.danger:hover{background:#fdf0f2}
.cmenu button.ok{background:#1e88c7;color:#fff;text-align:center;flex:1}
.cmenu button.ok:hover{background:#1673ad}
.cmenu input{font-family:inherit;font-size:14px;padding:7px 9px;border:1px solid #cfe0eb;border-radius:8px;width:100%}
.cmenu .cm-row{display:flex;gap:6px}
.cmenu .cm-row button:not(.ok){background:#f1f5f8;text-align:center;flex:0 0 auto}
.cmenu .cm-l{display:flex;align-items:center;gap:6px;font-size:14px;color:#26384a;padding:4px 9px}
.cmenu select{flex:1;font-family:inherit;font-size:13.5px;padding:6px 4px;border:1px solid #cfe0eb;border-radius:8px;max-width:150px}
/* ---------- log ---------- */
.log-hint{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.logitem{
  display:flex;gap:9px;align-items:flex-start;background:#fff;border:1px solid #e3eef6;
  border-radius:12px;padding:9px 11px;margin-bottom:7px
}
.logitem .ic{font-size:17px;line-height:1.25}
.logitem .body{flex:1;min-width:0}

<body>

<header>
  <div class="hrow">
    <h1>❄️ 凱德佛堂 冷凍庫 物品位置管理</h1>
    <div class="dot" id="dot"></div><span id="syncTxt">連線中…</span>
  </div>
</header>

<!-- ============ 位置圖（含語音輸入） ============ -->
<section class="view on" id="view-map">
  <div class="mapmain">
    <!-- 左欄：搜尋／經手人／說明／語音（桌機放側邊，不佔冰箱上下高度） -->
    <aside class="side">
      <input id="search" type="text" autocomplete="off" placeholder="搜尋品名（例：當歸、素排）…">
      <div class="searchinfo" id="searchInfo"></div>
      <div class="opbar">
        <span>經手人：</span><b id="opName">未設定</b>
        <button type="button" id="btnOp">修改</button>
      </div>
      <label class="bytoggle"><input type="checkbox" id="showBy"> 👤 顯示經手人<small>（預設隱藏）</small></label>
      <div class="bytip" id="lineTip">
        目前在 <b>LINE 內建瀏覽器</b>。若按了沒反應，請點右上角「⋯」→ 用其他瀏覽器開啟本頁。
      </div>
      <p class="legend" id="focusBar" style="display:none"></p>
      <p class="legend">點物品＝改數量／備註；<b>拖出去＝移出冰箱</b>、<b>拖回冰箱＝放回</b>、拖到別層＝移動；點 <b>⋯</b>＝改名／刪除。<b>只寫品名＝還有 1 包</b>；數量 0 的品項不顯示。</p>
    </aside>

    <div class="freezer" id="freezer"></div>
    <aside class="outside" id="outsideZone">
      <button class="btn add" id="btnAdd">＋ 新增物品</button>
      <div class="os-head">📦 食材庫</div>
      <div class="os-items" id="osItems"></div>
      <button type="button" id="osClear">清暫存</button>
    </aside>
  </div>
</section>

<!-- ============ 編輯視窗 ============ -->
<div class="mask" id="mask">
  <div class="sheet" id="sheet">
    <h2 id="sheetTitle">新增物品</h2>
    <label style="display:flex;align-items:center;gap:8px">品名 <span style="color:#c9455a">*</span>
      <button type="button" class="btn sm ghost" id="btnVoiceFill" style="margin-left:auto">🎤 用說的</button>
    </label>
    <input type="text" id="fName" placeholder="例：當歸、素排骨、香菇頭">
    <div class="vhint" id="fVoiceHint" style="display:none;margin:7px 0 0"></div>
    <div class="row">
      <div>
        <label>數量</label>
        <div class="stepper">
          <button type="button" id="minus">−</button>
          <input type="number" id="fQty" value="1" min="0" step="1" inputmode="numeric">
          <button type="button" id="plus">＋</button>
        </div>
      </div>
      <div>
        <label>單位</label>
        <select id="fUnit">
          <option>包</option><option>袋</option><option>盒</option><option>罐</option>
          <option>瓶</option><option>斤</option><option>台兩</option><option>份</option><option>個</option>
        </select>
      </div>
    </div>
    <label>經手人（放入／移出者） <span style="color:#c9455a">*</span></label>
    <input type="text" id="fBy" list="byList" autocomplete="off" placeholder="例：陳師姐、林前賢">
    <datalist id="byList"></datalist>
    <label>樓層</label>
    <select id="fFloor"></select>
    <label>備註（選填）</label>
    <input type="text" id="fNote" placeholder="例：2026 年普度用、開封過">
    <div class="acts">
      <button class="btn ghost" id="btnCancel">取消</button>
      <button class="btn ok" id="btnSave">儲存</button>
      <button class="btn danger" id="btnDel" style="display:none">刪除</button>
    </div>
    <div class="tiny" id="metaInfo"></div>
  </div>
</div>

<!-- 浮動語音（開始聽）：固定在畫面右下角，不佔版面 -->
<div class="voice-float" id="voiceFloat">
  <div id="vCard"></div>
  <div class="vheard" id="vHeard" hidden></div>
  <div class="vfrow">
    <span class="vdot" id="vDot"></span>
    <span id="vState">講：香菇頭 一包</span>
    <button class="btn sm" id="btnListen" title="按一下開始聽：講「香菇頭 一包」「移出素排骨兩袋」「放回當歸五包」">🎤 開始聽</button>
    <button class="btn sm ghost" id="btnStop">停止</button>
  </div>
</div>

<!-- 第一次操作前先問經手人（輸入一次記住這台裝置，之後不再問） -->
<div class="mask" id="opMask">
  <div class="opdlg">
    <h3>請先輸入經手人姓名</h3>
    <p>為了知道東西是誰放的／誰拿的，第一次使用要先填一次。<b>填過就記住這台裝置，以後不會再問。</b></p>
    <input type="text" id="opInput" list="byList" autocomplete="off" placeholder="例：曾劉榮、陳師姐">
    <div class="acts">
      <button class="btn ok" id="opOk">確定，開始使用</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>window.FIREBASE_CONFIG={
  apiKey: "AIzaSyCRazQsleeTILp7VO5zYbeiy9dtOxrVenc",
  authDomain: "bentodish-alan.firebaseapp.com",
  projectId: "bentodish-alan",
  storageBucket: "bentodish-alan.firebasestorage.app",
  messagingSenderId: "652937239500",
  appId: "1:652937239500:web:2c4c3b28b2311f2b12db69"
};</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot,
         query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { parseUtterance } from "./voice-parse.js";

/* ================= 設定 ================= */
const COLL_ITEMS = "frozen_items";
const COLL_LOG   = "frozen_log";
/* 門別（上門／下門）；每扇門有幾層、叫什麼，看下面的 FLOORS */
const DOORS = [
  { key: "U", label: "上　門" },
  { key: "D", label: "下　門" }
];
/* 食材庫內建常備品項（拖進冰箱就建檔）
   ※ 一定要放在 renderMap() 首次執行之前（它會呼叫 renderOutside()），否則 TDZ 例外會讓整頁掛掉 */
const STAPLES = ["當歸", "枸杞", "紅棗", "豆包", "麵腸", "火腿", "素丸子", "牛蒡排", "鱈魚排",
                 "飯巾布", "麵線", "饅頭", "包子", "綠豆沙餡",
                 "小魚干", "紅糟麵腸", "黑豆", "花生仁", "大薏仁", "豆干", "大胖干",
                 "核桃", "腰果", "海帶芽", "味噌"];

/* 樓層：key 決定屬哪一扇門；同一扇門裡的先後順序決定「第幾層」（每扇門各自從第 1 層算）
   ※ id 是資料庫用的固定編號：新增樓層要給「沒用過的號碼」，不要動舊號碼，免得住錯位置 */
const FLOORS = [
  { id: 1, door: "上門", key: "U", name: "中藥區、甜餡料、湯料" },
  { id: 2, door: "上門", key: "U", name: "素料" },
  { id: 5, door: "上門", key: "U", name: "素料" },
  { id: 3, door: "下門", key: "D", name: "素料" },
  { id: 4, door: "下門", key: "D", name: "其他" }
];
/* 自動算「第幾層」與格位名稱（二層＝上/下格，三層＝上/中/下格） */
FLOORS.forEach(f => {
  const peers = FLOORS.filter(x => x.key === f.key);
  const n = peers.length, i = peers.indexOf(f);
  f.local = i + 1;
  f.slot = n === 2 ? ["上格", "下格"][i]
         : n === 3 ? ["上格", "中格", "下格"][i]
         : `第${i + 1}格`;
});
const floorOf = id => FLOORS.find(f => f.id === Number(id)) || { id: Number(id), name: "未指定", door: "", local: Number(id), slot: "" };
/* 層數一律由最上層往下連續編號（第1層＝最上面那層），不顯示上下門字樣 */
const floorNo = id => { const i = FLOORS.findIndex(f => f.id === Number(id)); return i >= 0 ? i + 1 : Number(id); };
const floorLabel = id => `第${floorNo(id)}層`;
const floorFull = id => { const f = floorOf(id); return `${floorLabel(id)} ${f.name}`; };

/* ================= Firebase ================= */
const app  = initializeApp(window.FIREBASE_CONFIG);
const auth = getAuth(app);
const db   = getFirestore(app);
let ready = false, items = [], editId = null, pendingHighlight = null, focusedFloor = null, outside = [], pendingPlace = null;

/* ================= 小工具 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let toastTimer = null;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 2600);
}
function fmtTime(ms) {
  if (!ms) return "";
  const d = new Date(ms);
  const p = n => String(n).padStart(2, "0");
  const now = new Date();
  const sameYear = d.getFullYear() === now.getFullYear();
  return (sameYear ? "" : d.getFullYear() + "/") + `${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function sync(state, text) {
  const dot = $("#dot");
  dot.className = "dot" + (state === "on" ? " on" : state === "off" ? " off" : "");
  $("#syncTxt").textContent = text;
}

/* ================= 經手人（本機記憶，LINE 內建瀏覽器可能擋 localStorage → 退回記憶體） ================= */
const memStore = {};
const store = {
  get(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return memStore[k] || ""; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { memStore[k] = v; } }
};
let operator = store.get("frozen_operator");
/* 是否顯示經手人（預設不顯示；用左欄開關控制）
   ※ 宣告位置必須在 renderMap() 首次執行之前，且 store 已定義 */
let showBy = store.get("frozen_showby") === "1";
function byHistory() {
  const saved = (store.get("frozen_bys") || "").split("|").filter(Boolean);
  const used = items.map(i => i.by).filter(Boolean);
  return Array.from(new Set([...used, ...saved]));
}
function refreshByList() {
  $("#byList").innerHTML = byHistory().map(n => `<option value="${esc(n)}"></option>`).join("");
}
function renderOperator() {
  $("#opName").textContent = operator || "未填（第一次操作會請您輸入）";
  const bar = document.querySelector(".opbar");
  if (bar) bar.classList.toggle("need", !operator);
}
function setOperator(v) {
  operator = (v || "").trim();
  store.set("frozen_operator", operator);
  if (operator) rememberBy(operator);
  renderOperator();
}
function rememberBy(name) {
  if (!name) return;
  const arr = (store.get("frozen_bys") || "").split("|").filter(Boolean);
  if (!arr.includes(name)) arr.unshift(name);
  store.set("frozen_bys", arr.slice(0, 30).join("|"));
  refreshByList();
}
renderOperator();
/* ============ 經手人提醒：第一次要操作前先問一次，填過就記住這台裝置 ============ */
let opThen = null;
function ensureOperator(then) {
  if (operator) return true;                      // 已經填過 → 直接放行（不再問）
  opThen = typeof then === "function" ? then : null;
  $("#opInput").value = "";
  $("#opMask").classList.add("on");
  setTimeout(() => { try { $("#opInput").focus(); } catch (e) {} }, 90);
  return false;                                   // 對話框本身已經寫清楚，不再跳提示蓋住按鈕
}
function closeOpDialog() { $("#opMask").classList.remove("on"); }
function submitOperator() {
  const v = ($("#opInput").value || "").trim();
  if (!v) { toast("請輸入姓名"); return; }
  setOperator(v);
  closeOpDialog();
  toast("經手人：" + v + "（已記住，之後不用再輸入）");
  const f = opThen; opThen = null;
  if (f) f();
}
$("#opOk").addEventListener("click", submitOperator);
$("#opInput").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); submitOperator(); } });
$("#opMask").addEventListener("click", e => { if (e.target.id === "opMask") closeOpDialog(); });
$("#btnOp").addEventListener("click", () => {
  $("#opInput").value = operator || "";
  $("#opMask").classList.add("on");
  setTimeout(() => { try { $("#opInput").select(); } catch (e) {} }, 90);
});
/* 顯示／隱藏經手人（預設隱藏） */
$("#showBy").checked = showBy;
$("#showBy").addEventListener("change", e => {
  showBy = !!e.target.checked;
  store.set("frozen_showby", showBy ? "1" : "0");
  renderMap();
  toast(showBy ? "已顯示經手人" : "已隱藏經手人");
});

/* LINE 內建瀏覽器提示 */
if (/Line\/|LIFF/i.test(navigator.userAgent)) $("#lineTip").classList.add("on");

/* ================= 匿名登入，自動） ================= */
sync("", "連線中…");
onAuthStateChanged(auth, user => {
  if (user) { ready = true; sync("on", "已連線・即時同步"); listen(); }
  else {
    signInAnonymously(auth).catch(e => {
      console.error("匿名登入失敗", e);
      sync("off", "離線（僅檢視）");
      toast("無法連線雲端：" + (e && e.code ? e.code : e.message));
    });
  }
});

/* ================= 即時同步 ================= */
let unsubItems = null;
function listen() {
  if (unsubItems) return;
  unsubItems = onSnapshot(query(collection(db, COLL_ITEMS), orderBy("name")), snap => {
    items = snap.docs.map(d => Object.assign({ _id: d.id }, d.data()));
    renderMap(); applySearch();
  }, err => { console.error(err); sync("off", "讀取失敗"); toast("讀取失敗：" + err.code); });
}

/* ================= 位置圖 ================= */
function tierHTML(fid) {
  const f = floorOf(fid);
  /* 只顯示冰箱裡還有的（數量 0 的用完品項不顯示） */
  const list = items.filter(i => Number(i.floor) === fid && (Number(i.qty) || 0) > 0);
  const total = list.reduce((s, i) => s + (Number(i.qty) || 0), 0);
  const countTxt = list.length ? `${list.length} 項${total > list.length ? ` / 共 ${total}` : ""}` : "";
  return `<div class="tier" id="tier-${fid}" data-floor="${fid}" data-door="${f.key}">
      <div class="tier-head">
        <span class="fl-name">${esc(f.name)}</span>
        <span class="fl-count">${countTxt}</span>
      </div>
      <div class="items">
        ${list.length ? list.map(chipHTML).join("") : '<span class="empty">尚無物品</span>'}
      </div>
      <span class="tier-no">第${floorNo(fid)}層</span>
    </div>`;
}

function renderMap() {
  const box = $("#freezer");
  const doors = DOORS.map(d => ({ ...d, floors: FLOORS.filter(f => f.key === d.key).map(f => f.id) }));
  box.innerHTML = `
    <div class="doors">
      ${doors.map(d => `
        <section class="door" data-door="${d.key}">
          <div class="hinge h1"></div><div class="hinge h2"></div>
          <div class="shelves">${d.floors.map(tierHTML).join("")}</div>
          <div class="handle"></div>
          <div class="lock"></div>
        </section>`).join("")}
    </div>`;

  box.querySelectorAll(".chip").forEach(el => {
    const it = items.find(i => i._id === el.dataset.id);
    if (it) bindChipGestures(el, it);
  });
  /* 選了食材庫的食材後，點某一層＝放進那一層 */
  box.querySelectorAll(".tier").forEach(t => t.addEventListener("click", ev2 => {
    if (!pendingPlace || (ev2.target.closest && ev2.target.closest(".chip"))) return;
    const fid = Number(t.dataset.floor);
    const entry = pendingPlace;
    putBack(entry, fid);
  }));
  refreshByList();
  renderOutside();   /* 食材庫跟著資料更新：用完／已移出的會自動列進去 */
  /* 上下門依「各有幾層」比例分配高度（上門3層會比下門2層高一些，每層才塞得下） */
  box.querySelectorAll(".door").forEach(d => { d.style.flexGrow = String(d.querySelectorAll(".tier").length || 1); });
  /* 重繪後把焦點框補回來（語音/掃碼指定的樓層） */
  if (focusedFloor != null) {
    const ft = box.querySelector(`.tier[data-floor="${focusedFloor}"]`);
    if (ft) ft.classList.add("focus");
  }
  /* 語音/編輯更新後，讓剛動到的品項閃一下 */
  if (pendingHighlight) {
    const el = box.querySelector(`.chip[data-id="${pendingHighlight}"]`);
    if (el) {
      el.classList.add("hit");
      setTimeout(() => el.classList.remove("hit"), 2600);
      pendingHighlight = null;
    }
  }
}
/* 捲到指定樓層、閃框、保留焦點框 10 秒 */
function focusTier(fid) {
  focusedFloor = Number(fid);
  const el = document.getElementById("tier-" + fid);
  if (!el) return;
  el.scrollIntoView({ behavior: "smooth", block: "center" });
  el.classList.add("focus", "pulse");
  setTimeout(() => el.classList.remove("pulse"), 3600);
  setTimeout(() => {
    const t = document.getElementById("tier-" + fid);
    if (t) t.classList.remove("focus");
    if (focusedFloor === Number(fid)) focusedFloor = null;
  }, 10000);
}
/* 先畫出空冰箱骨架，資料（Firestore）回來再填內容 → 斷線／慢連線時不會整片空白 */
renderMap();

function chipHTML(it) {
  const q = Number(it.qty) || 0;
  const u = esc(it.unit || "");
  /* 數量 1 不標示（大部分都是一包）；2 以上才寫數量 */
  const qtyBadge = q > 1 ? `<span class="q">${q}${u ? " " + u : ""}</span>` : "";
  return `<button class="chip" data-id="${esc(it._id)}" data-name="${esc(it.name)}"
      title="${esc([it.name, q + (it.unit || ""), it.note ? "備註：" + it.note : "", it.by ? "放入：" + it.by : "", it.updatedAt ? "更新：" + fmtTime(it.updatedAt) : ""].filter(Boolean).join("　"))}">
      <span class="nm">${esc(it.name)}</span>
      ${qtyBadge}
      ${(showBy && it.by) ? `<span class="by">👤${esc(it.by)}</span>` : ""}
      <span class="more" title="更多（改名／刪除／移到別層）">⋯</span>
    </button>`;
}

/* ================= 就地操作：拖曳換層、就地選單（改名／移層／刪除） ================= */
let dragCtx = null, suppressClick = false, chipMenuEl = null;

function closeChipMenu() {
  if (chipMenuEl) { chipMenuEl.remove(); chipMenuEl = null; }
  document.removeEventListener("pointerdown", outsideCloseMenu, true);
}
function outsideCloseMenu(e) {
  const onMore = e.target.closest && e.target.closest(".more");
  if (chipMenuEl && !chipMenuEl.contains(e.target) && !onMore) closeChipMenu();
}

async function moveItemTo(it, floor) {
  const from = Number(it.floor), to = Number(floor);
  if (!needReady() || from === to) return;
  const by = operator || it.by || "";
  if (!by) { toast("請先設定經手人"); return; }
  try {
    await updateDoc(doc(db, COLL_ITEMS, it._id), { floor: to, updatedAt: Date.now() });
    await addLog(to, it.name, Number(it.qty) || 0, it.unit || "", "move", by, from);
    toast(`已移動：${it.name} → ${floorLabel(to)}`);
    pendingHighlight = it._id; focusedFloor = to;
  } catch (e) { toast("移動失敗：" + (e.code || e.message)); }
}

async function renameItem(it, newName) {
  const nm = (newName || "").trim();
  if (!nm || nm === it.name || !needReady()) return;
  const by = operator || it.by || "";
  if (!by) { toast("請先設定經手人"); return; }
  try {
    await updateDoc(doc(db, COLL_ITEMS, it._id), { name: nm, updatedAt: Date.now() });
    await addLog(Number(it.floor), nm, Number(it.qty) || 0, it.unit || "", "rename", by, null, it.name);
    toast(`已改名：${it.name} → ${nm}`);
    pendingHighlight = it._id;
  } catch (e) { toast("改名失敗：" + (e.code || e.message)); }
}

async function removeItem(it) {
  if (!needReady()) return;
  const by = operator || it.by || "";
  if (!by) { toast("請先設定經手人"); return; }
  if (!confirm(`確定刪除「${it.name}」？\n（紀錄會保留一筆刪除記錄）`)) return;
  try {
    await deleteDoc(doc(db, COLL_ITEMS, it._id));
    await addLog(Number(it.floor), it.name, Number(it.qty) || 0, it.unit || "", "del", by);
    toast("已刪除：" + it.name);
  } catch (e) { toast("刪除失敗：" + (e.code || e.message)); }
}

function openChipMenu(it, anchor) {
  if (!ensureOperator()) return;
  closeChipMenu();
  const others = FLOORS.filter(f => f.id !== Number(it.floor));
  const el = document.createElement("div");
  el.className = "cmenu";
  el.innerHTML = `
    <div class="cm-h">${esc(it.name)}</div>
    <button type="button" data-a="rename">✏️ 修改名稱</button>
    <label class="cm-l">📦 移到
      <select id="cmMove"><option value="">選樓層…</option>
        ${others.map(f => `<option value="${f.id}">${esc(floorLabel(f.id))} — ${esc(f.name)}</option>`).join("")}
      </select>
    </label>
    <button type="button" class="danger" data-a="del">🗑️ 刪除</button>`;
  document.body.appendChild(el);
  chipMenuEl = el;

  const r = anchor.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
  const x = Math.min(Math.max(8, r.left), innerWidth - w - 8);
  let y = r.bottom + 6;
  if (y + h > innerHeight - 8) y = Math.max(8, r.top - h - 6);
  el.style.left = x + "px"; el.style.top = y + "px";

  el.querySelector('[data-a="rename"]').addEventListener("click", () => {
    el.innerHTML = `<div class="cm-h">修改名稱</div>
      <input id="cmName" value="${esc(it.name)}">
      <div class="cm-row"><button type="button" data-a="cancel">取消</button>
      <button type="button" class="ok" data-a="ok">確定</button></div>`;
    const inp = el.querySelector("#cmName");
    inp.focus(); inp.select();
    const ok = () => { const v = inp.value; closeChipMenu(); renameItem(it, v); };
    el.querySelector('[data-a="ok"]').addEventListener("click", ok);
    el.querySelector('[data-a="cancel"]').addEventListener("click", closeChipMenu);
    inp.addEventListener("keydown", e => { if (e.key === "Enter") ok(); });
  });
  el.querySelector('[data-a="del"]').addEventListener("click", () => { closeChipMenu(); removeItem(it); });
  el.querySelector("#cmMove").addEventListener("change", e => {
    const v = e.target.value; closeChipMenu();
    if (v) moveItemTo(it, Number(v));
  });
  setTimeout(() => document.addEventListener("pointerdown", outsideCloseMenu, true), 0);
}

/* ================= 冰箱外暫存區：拖出去＝移出冰箱、拖回來＝放回 ================= */
/* （outside 陣列宣告在最上面的狀態列，因為 renderMap() 在載入時就會呼叫 renderOutside()） */

/* 食材庫＝「冰箱裡沒有的」：本次拖出去的 ＋ 資料庫裡數量 0 的（重整後也還在，可拖回去） */
function osEntries() {
  const seen = new Set(outside.map(o => o.id));
  const gone = items.filter(i => (Number(i.qty) || 0) <= 0 && !seen.has(i._id))
    .map(i => ({ id: i._id, name: i.name, qty: 0, unit: i.unit || "", floor: Number(i.floor), gone: true }));
  return [...outside, ...gone];
}
/* 常備食材：冰箱裡目前沒有的（同名品項數量 > 0 就不列，避免重複） */
function stapleEntries() {
  const have = new Set(items.filter(i => (Number(i.qty) || 0) > 0).map(i => (i.name || "").trim()));
  return STAPLES.filter(n => !have.has(n)).map(n => ({ id: null, name: n, qty: 0, unit: "", staple: true }));
}
/* 點選入庫：先點食材庫的食材，再點要放進的樓層（手機不用拖也能放） */
function setPendingPlace(entry) {
  pendingPlace = entry || null;
  document.querySelectorAll(".tier").forEach(t => t.classList.toggle("awaitDrop", !!pendingPlace));
  renderOutside();
  if (pendingPlace) toast(`已選「${pendingPlace.name}」→ 請點要放進哪一層（再點一次取消）`);
}
function renderOutside() {
  const box = $("#osItems");
  if (!box) return;
  const gone = osEntries();
  const goneNames = new Set(gone.map(o => (o.name || "").trim()));
  const staples = stapleEntries().filter(s => !goneNames.has(s.name));   // 已列在「冰箱裡沒有的」就不要重複
  const list = [...staples, ...gone];
  if (!list.length) { box.innerHTML = '<span class="empty">（空）</span>'; return; }
  const chip = (o, i) => `<button class="chip os-chip${o.staple ? " staple" : ""}${(pendingPlace && pendingPlace.name === o.name) ? " sel" : ""}" data-os="${i}" data-name="${esc(o.name)}"
      title="${o.staple ? "拖進冰箱任一層＝放進冰箱（或點一下再點樓層）" : "拖回冰箱任一層＝放回（或點一下再點樓層）"}">${esc(o.name)}${o.qty > 1 ? `<span class="q">${o.qty}${esc(o.unit || "")}</span>` : ""}${o.staple ? "" : '<span class="more" title="更多">⋯</span>'}</button>`;
  box.innerHTML = list.map((o, i) => chip(o, i)).join("");
  box.querySelectorAll(".os-chip").forEach(el => bindOutsideGestures(el, list[Number(el.dataset.os)]));
}

async function takeOut(it) {
  if (!ensureOperator()) return;
  const q = Number(it.qty) || 0;
  if (!needReady() || q <= 0) return;
  const by = operator || it.by || "";
  if (!by) { toast("請先設定經手人"); return; }
  const unit = it.unit || "";
  try {
    await updateDoc(doc(db, COLL_ITEMS, it._id), { qty: q - 1, updatedAt: Date.now() });
    await addLog(Number(it.floor), it.name, 1, unit, "out", by);
    const e = outside.find(o => o.id === it._id);
    if (e) e.qty += 1;
    else outside.unshift({ id: it._id, name: it.name, qty: 1, unit, floor: Number(it.floor) });
    renderOutside();
    pendingHighlight = it._id;
    toast(`已移出：${it.name} 1${unit}（要放回就把「冰箱外」的它拖回冰箱層）`);
  } catch (err) { toast("移出失敗：" + (err.code || err.message)); }
}

async function putBack(entry, floor) {
  if (!entry || !ensureOperator() || !needReady()) return;
  setPendingPlace(null);
  const found = items.find(i => i._id === entry.id);
  const by = operator || (found && found.by) || "";
  if (!by) { toast("請先設定經手人"); return; }
  const it = found;
  try {
    if (it) {
      await updateDoc(doc(db, COLL_ITEMS, entry.id),
        { qty: (Number(it.qty) || 0) + 1, floor: Number(floor), updatedAt: Date.now() });
      await addLog(Number(floor), entry.name, 1, entry.unit || it.unit || "", "in", by);
      pendingHighlight = entry.id;
    } else {
      await addDoc(collection(db, COLL_ITEMS), {
        name: entry.name, qty: 1, unit: entry.unit || "", floor: Number(floor), note: "", by,
        updatedAt: Date.now(), createdAt: Date.now()
      });
      await addLog(Number(floor), entry.name, 1, entry.unit || "", "new", by);
    }
    focusedFloor = Number(floor);
    const e = outside.find(o => o.id === entry.id);
    if (e) { e.qty -= 1; if (e.qty <= 0) outside = outside.filter(x => x !== e); }
    renderOutside();
    toast(`${entry.staple ? "已放入冰箱" : "已放回"}：${entry.name} → ${floorLabel(floor)}`);
  } catch (err) { toast("放回失敗：" + (err.code || err.message)); }
}

$("#osClear").addEventListener("click", () => {
  if (!outside.length) { toast("「冰箱外」是空的"); return; }
  if (!confirm("清掉「剛拖出來」的暫存清單？\n（冰箱裡本來就沒有的那幾樣不會被清掉，庫存與紀錄也不受影響）")) return;
  outside = [];
  renderOutside();
});
renderOutside();

/* 拖曳中浮出的「移出」放置區 */
let dropOutEl = null, autoScrollRaf = 0;
function ensureDropOut() {
  if (dropOutEl) return dropOutEl;
  dropOutEl = document.createElement("div");
  dropOutEl.id = "dropOut";
  dropOutEl.textContent = "📤 放這裡＝移出冰箱";
  document.body.appendChild(dropOutEl);
  return dropOutEl;
}
function autoScroll() {
  if (!dragCtx) { autoScrollRaf = 0; return; }
  const y = dragCtx.lastY;
  if (y < 100) window.scrollBy(0, -16);
  else if (y > innerHeight - 100) window.scrollBy(0, 16);
  autoScrollRaf = requestAnimationFrame(autoScroll);
}

/* 拖曳：滑鼠可直接拖；手指要橫向起手（直向＝捲動頁面） */
function startDrag(el, it, ev, kind) {
  const g = document.createElement("div");
  g.className = "chip-ghost";
  g.textContent = it.name + ((Number(it.qty) || 0) > 1 ? ` ${it.qty}${it.unit || ""}` : "");
  document.body.appendChild(g);
  el.classList.add("dragging");
  dragCtx = { el, it, kind: kind || "item", ghost: g, targetTier: null, overOut: false, lastY: ev.clientY };
  suppressClick = true;
  ensureDropOut().classList.add("on");
  try { el.setPointerCapture(ev.pointerId); } catch (_) {}
  if (!autoScrollRaf) autoScrollRaf = requestAnimationFrame(autoScroll);
  moveDrag(ev);
}
function moveDrag(ev) {
  if (!dragCtx) return;
  dragCtx.lastY = ev.clientY;
  dragCtx.ghost.style.left = ev.clientX + "px";
  dragCtx.ghost.style.top = ev.clientY + "px";
  const under = document.elementFromPoint(ev.clientX, ev.clientY);
  const tier = under && under.closest ? under.closest(".tier") : null;
  let overOut = false;
  if (dragCtx.kind === "item") {
    const d = ensureDropOut(), r = d.getBoundingClientRect();
    overOut = ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom;
    const oz = document.getElementById("outsideZone");
    if (!overOut && oz && under && oz.contains(under)) overOut = true;   // 拖到下方「冰箱外」區塊也算
    d.classList.toggle("over", overOut);
    if (oz) oz.classList.toggle("over", overOut);
  }
  if (dragCtx.targetTier !== tier) {
    if (dragCtx.targetTier) dragCtx.targetTier.classList.remove("drop");
    dragCtx.targetTier = tier;
    if (tier) tier.classList.add("drop");
  }
  dragCtx.overOut = overOut;
}
function endDrag() {
  if (!dragCtx) return;
  const { el, it, kind, ghost, targetTier, overOut } = dragCtx;
  el.classList.remove("dragging");
  if (ghost) ghost.remove();
  const d = ensureDropOut(); d.classList.remove("on", "over");
  const oz = document.getElementById("outsideZone");
  if (oz) oz.classList.remove("over");
  if (targetTier) targetTier.classList.remove("drop");
  dragCtx = null;
  if (kind === "item") {
    if (overOut) takeOut(it);                        // 拖到「移出」區＝移出冰箱
    else if (targetTier) {
      const fid = Number(targetTier.dataset.floor);
      if (fid && fid !== Number(it.floor)) moveItemTo(it, fid);
    }
  } else if (targetTier) {
    putBack(it, Number(targetTier.dataset.floor));   // 從「冰箱外」拖回某層＝放回
  }
  setTimeout(() => { suppressClick = false; }, 250);
}
function bindChipGestures(el, it, kind) {
  el.addEventListener("click", e => {
    if (suppressClick) { suppressClick = false; return; }
    if (e.target.closest(".more")) {                     // ⋯：改名／移層／刪除
      const real = kind === "outside" ? items.find(i => i._id === it.id) : it;
      if (real) { e.stopPropagation(); openChipMenu(real, el); }
      return;
    }
    if (kind === "outside") {
      setPendingPlace((pendingPlace && pendingPlace.name === it.name) ? null : it);
      return;
    }
    openEdit(it._id);
  });
  el.addEventListener("keydown", e => {
    if (kind === "outside") return;
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openEdit(it._id); }
  });
  el.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    if (e.target.closest(".more")) return;              // ⋯ 只開選單，不拖
    if (!ensureOperator()) return;                      // 還沒有經手人 → 先請他填一次
    const mouse = e.pointerType === "mouse";
    const sx = e.clientX, sy = e.clientY;
    let mode = "pending";
    const onMove = ev2 => {
      const dx = ev2.clientX - sx, dy = ev2.clientY - sy;
      if (mode === "pending") {
        const far = Math.hypot(dx, dy) > (mouse ? 6 : 9);
        if (far && (mouse || Math.abs(dx) >= Math.abs(dy))) { mode = "drag"; startDrag(el, it, ev2, kind); }
        else if (far) { mode = "cancel"; cleanup(); }   // 手指直向滑＝捲動頁面
      } else if (mode === "drag") moveDrag(ev2);
    };
    const onUp = () => { if (mode === "drag") endDrag(); cleanup(); };
    const cleanup = () => {
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      document.removeEventListener("pointercancel", onUp);
    };
    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp);
    document.addEventListener("pointercancel", onUp);
  });
}
function bindOutsideGestures(el, entry) { bindChipGestures(el, entry, "outside"); }

/* ================= 搜尋 ================= */
function applySearch() {
  const kw = ($("#search").value || "").trim().toLowerCase();
  document.querySelectorAll("#freezer .chip").forEach(el => el.classList.remove("hit"));
  if (!kw) { $("#searchInfo").textContent = ""; return; }
  let hits = 0, floors = new Set();
  document.querySelectorAll("#freezer .chip").forEach(el => {
    const hit = (el.dataset.name || "").toLowerCase().includes(kw);
    const tier = el.closest(".tier");
    if (hit && tier) { el.classList.add("hit"); hits++; floors.add(tier.dataset.floor); }
  });
  if (hits) {
    $("#searchInfo").textContent = `找到 ${hits} 項，位於：` + [...floors].sort().map(f => `${floorLabel(f)} ${floorOf(f).name}`).join("、");
  } else {
    /* 格層只顯示冰箱還有的；若查的品項剛好已用完，提醒一下（可用語音「放回」補回） */
    const gone = items.filter(i => (Number(i.qty) || 0) <= 0 && (i.name || "").toLowerCase().includes(kw));
    $("#searchInfo").textContent = gone.length
      ? `「${gone.map(i => i.name).join("、")}」不在冰箱裡（已列在食材庫，可拖回冰箱或用語音「放回 ${gone[0].name} 一包」）`
      : "查無此品名";
  }
}
$("#search").addEventListener("input", applySearch);

/* ================= 樓層選擇器 ================= */
$("#fFloor").innerHTML = FLOORS.map(f => `<option value="${f.id}">${esc(floorLabel(f.id))} — ${esc(f.name)}</option>`).join("");

/* ================= 編輯視窗 ================= */
function openEdit(id, presetFloor) {
  if (!ensureOperator()) return;
  stopListen();                                  // 開編輯視窗時先關掉主頁語音，避免搶麥克風
  if (fillRec) { try { fillRec.stop(); } catch (_) {} }
  $("#fVoiceHint").style.display = "none";
  $("#fVoiceHint").textContent = "";
  $("#btnVoiceFill").textContent = "🎤 用說的";
  editId = id || null;
  const it = id ? items.find(i => i._id === id) : null;
  $("#sheetTitle").textContent = it ? "修改物品" : "新增物品";
  $("#fName").value  = it ? it.name : "";
  $("#fQty").value   = it ? (Number(it.qty) || 0) : 1;
  $("#fUnit").value  = it && it.unit ? it.unit : "包";
  $("#fFloor").value = String(it ? Number(it.floor) : (presetFloor || FLOORS[0].id));
  $("#fNote").value  = it && it.note ? it.note : "";
  $("#fBy").value    = it && it.by ? it.by : operator;
  $("#btnDel").style.display = it ? "" : "none";
  refreshByList();
  $("#metaInfo").textContent = it
    ? `上次更新：${fmtTime(it.updatedAt)}${it.by ? "　登錄者：" + it.by : ""}`
    : "";
  $("#mask").classList.add("on");
  setTimeout(() => $("#fName").focus(), 120);
}
function closeEdit() { $("#mask").classList.remove("on"); editId = null; }
$("#btnCancel").addEventListener("click", closeEdit);
$("#mask").addEventListener("click", e => { if (e.target.id === "mask") closeEdit(); });
$("#minus").addEventListener("click", () => { const q = $("#fQty"); q.value = Math.max(0, (Number(q.value) || 0) - 1); });
$("#plus").addEventListener("click",  () => { const q = $("#fQty"); q.value = (Number(q.value) || 0) + 1; });
$("#btnAdd").addEventListener("click", () => openEdit(null));

/* ================= 寫入資料 ================= */
function needReady() {
  if (!ready) { toast("尚未連上雲端，請稍後再試"); return false; }
  return true;
}

$("#btnSave").addEventListener("click", async () => {
  if (!needReady()) return;
  const name = ($("#fName").value || "").trim();
  const qty  = Math.max(0, Number($("#fQty").value) || 0);
  const unit = $("#fUnit").value;
  const floor = Number($("#fFloor").value);
  const note = ($("#fNote").value || "").trim();
  const by   = ($("#fBy").value || "").trim();
  if (!name) { toast("請輸入品名"); return; }
  if (!by)   { toast("請填經手人（放入／移出者）"); $("#fBy").focus(); return; }
  setOperator(by); rememberBy(by);

  $("#btnSave").disabled = true;
  try {
    if (editId) {
      const old = items.find(i => i._id === editId) || {};
      await updateDoc(doc(db, COLL_ITEMS, editId), {
        name, qty, unit, floor, note, by, updatedAt: Date.now()
      });
      const diff = qty - (Number(old.qty) || 0);
      if (diff !== 0) await addLog(floor, name, Math.abs(diff), unit, diff > 0 ? "in" : "out", by);
      else await addLog(floor, name, qty, unit, "edit", by);
      toast("已更新：" + name);
      pendingHighlight = editId;
    } else {
      await addDoc(collection(db, COLL_ITEMS), {
        name, qty, unit, floor, note, by, updatedAt: Date.now(), createdAt: Date.now()
      });
      await addLog(floor, name, qty, unit, "new", by);
      toast("已新增：" + name);
    }
    closeEdit();
    /* 存完直接帶到該層：捲過去、框起來 */
    focusTier(floor);
  } catch (e) {
    console.error(e);
    toast("寫入失敗：" + (e.code || e.message));
  } finally { $("#btnSave").disabled = false; }
});

$("#btnDel").addEventListener("click", async () => {
  if (!editId || !needReady()) return;
  const it = items.find(i => i._id === editId) || {};
  if (!confirm(`確定刪除「${it.name}」？\n（紀錄會保留一筆刪除記錄）`)) return;
  const by = ($("#fBy").value || "").trim() || operator;
  if (!by) { toast("請填經手人（放入／移出者）"); $("#fBy").focus(); return; }
  setOperator(by); rememberBy(by);
  try {
    await deleteDoc(doc(db, COLL_ITEMS, editId));
    await addLog(Number(it.floor), it.name, Number(it.qty) || 0, it.unit || "", "del", by);
    toast("已刪除：" + it.name);
    closeEdit();
  } catch (e) { toast("刪除失敗：" + (e.code || e.message)); }
});

async function addLog(floor, name, qty, unit, action, by, from = null, oldName = null) {
  try {
    await addDoc(collection(db, COLL_LOG), {
      floor: Number(floor), name, qty, unit, action, by: by || "", at: Date.now(),
      ...(from != null ? { from: Number(from) } : {}),
      ...(oldName ? { old: oldName } : {})
    });
  } catch (e) { console.warn("紀錄寫入失敗", e); }
}

/* ================= 語音記帳（講一句 → 確認卡按一下 → 寫入） ================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, wakeLock = null, pendingVoice = null;

function vState(txt, live) {
  $("#vState").textContent = txt;
  $("#vDot").classList.toggle("live", !!live);
}
async function keepAwake(on) {
  try {
    if (on && "wakeLock" in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { /* 不支援就算了 */ }
}
function startListen() {
  if (!SR) { toast("此瀏覽器不支援語音辨識，請用 Android Chrome 開啟"); return; }
  if (listening) return;
  listening = true;
  rec = new SR();
  rec.lang = "zh-TW"; rec.continuous = true; rec.interimResults = true; rec.maxAlternatives = 1;
  rec.onstart = () => vState("聽取中…請講「品名＋數量」", true);
  rec.onresult = e => {
    let interim = "", final = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) final += r[0].transcript; else interim += r[0].transcript;
    }
    if (interim || final.trim()) $("#vHeard").hidden = false;
    if (interim) $("#vHeard").innerHTML = "…" + esc(interim);
    if (final.trim()) { $("#vHeard").innerHTML = "<b>" + esc(final.trim()) + "</b>"; handleVoice(final.trim()); }
  };
  rec.onerror = e => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      listening = false; keepAwake(false); vState("麥克風未授權", false);
      toast("請允許麥克風權限後再按「開始聽」");
    } else if (e.error !== "no-speech" && e.error !== "aborted") { console.warn("語音錯誤:", e.error); }
  };
  rec.onend = () => { if (listening) { try { rec.start(); } catch (_) {} } else vState("已停止", false); };
  try { rec.start(); keepAwake(true); } catch (e) { listening = false; toast("無法啟動語音：" + e.message); }
}
function stopListen() {
  listening = false;
  if (rec) { try { rec.stop(); } catch (_) {} }
  keepAwake(false); vState("已停止", false);
}

function handleVoice(text) {
  if (/^(停止|結束|不要聽|關掉)/.test(text)) { stopListen(); toast("已停止聽取"); return; }
  const r = parseUtterance(text, items);
  if (r.operatorName) { setOperator(r.operatorName); toast("經手人：" + r.operatorName); }
  pendingVoice = r;
  renderVoiceCard(r);
}

function renderVoiceCard(r) {
  const box = $("#vCard");
  const isIn = r.action === "in";
  if (!r.name) {
    pendingVoice = null;
    box.innerHTML = `<div class="vcard warn"><div class="big">🤔 沒聽清楚</div>
      <div class="sub">只聽到：「${esc(r.raw)}」<br>請再講一次，例如「香菇頭 一包」。</div></div>`;
    return;
  }
  if (!r.match || r.score < 45) {
    box.innerHTML = `<div class="vcard warn">
      <div class="big">❓ 找不到「<span class="nm">${esc(r.name)}</span>」</div>
      <div class="sub">這個品項還沒建過。要新增就按下面，或按取消再講一次。</div>
      <div class="acts">
        <button class="btn ghost" id="vCancel">取消</button>
        <button class="btn" id="vCreate">＋ 新增這個品項</button>
      </div></div>`;
    $("#vCancel").addEventListener("click", () => { pendingVoice = null; box.innerHTML = ""; $("#vHeard").hidden = true; });
    $("#vCreate").addEventListener("click", voiceCreate);
    return;
  }
  const it = r.match;
  const cur = Number(it.qty) || 0;
  const after = Math.max(0, cur + (isIn ? r.qty : -r.qty));
  const f = floorOf(it.floor);
  const floorWarn = (r.floor && Number(r.floor) !== Number(it.floor))
    ? `<br><span style="color:#c9455a">⚠️ 你講的是 ${esc(floorLabel(r.floor))}，但這個品項記在 ${esc(floorLabel(it.floor))}</span>` : "";
  box.innerHTML = `<div class="vcard">
    <div class="big">${isIn ? "⬇️ 置入" : "⬆️ 移出"}　<span class="nm">${esc(it.name)}</span>　${r.qty}${esc(r.unit || it.unit || "")}</div>
    <div class="sub">目前庫存：${cur}${esc(it.unit || "")} → <b>${after}${esc(it.unit || "")}</b>　·　${esc(floorLabel(it.floor))} ${esc(f.name)}${floorWarn}</div>
    <label>經手人</label>
    <input type="text" id="vBy" list="byList" value="${esc(operator)}" placeholder="例：陳師姐">
    <div class="acts">
      <button class="btn ghost" id="vCancel">取消</button>
      <button class="btn ok" id="vOk">✅ 確認</button>
    </div>
    <div class="tiny">聽到：「${esc(r.raw)}」</div></div>`;
  refreshByList();
  $("#vCancel").addEventListener("click", () => { pendingVoice = null; box.innerHTML = ""; });
  $("#vOk").addEventListener("click", confirmVoice);
}

function voiceCreate() {
  const r = pendingVoice;
  if (!r) return;
  openEdit(null, r.floor || 1);
  setTimeout(() => {
    $("#fName").value = r.name;
    $("#fQty").value = r.qty || 1;
    if (r.unit) $("#fUnit").value = r.unit;
  }, 80);
  $("#vCard").innerHTML = "";
}

async function confirmVoice() {
  const r = pendingVoice;
  if (!r || !r.match || !ensureOperator() || !needReady()) return;
  const by = ($("#vBy").value || "").trim();
  if (!by) { toast("請填經手人"); $("#vBy").focus(); return; }
  setOperator(by); rememberBy(by);
  const it = r.match;
  const isIn = r.action === "in";
  const newQty = Math.max(0, (Number(it.qty) || 0) + (isIn ? r.qty : -r.qty));
  $("#vOk").disabled = true;
  try {
    await updateDoc(doc(db, COLL_ITEMS, it._id), { qty: newQty, by, updatedAt: Date.now() });
    await addLog(Number(it.floor), it.name, r.qty, r.unit || it.unit || "", r.action, by);
    toast(`已${isIn ? "置入" : "移出"}：${it.name} ${r.qty}${r.unit || it.unit || ""}`);
    pendingVoice = null;
    $("#vCard").innerHTML = "";
    $("#vHeard").hidden = true;
    /* 直接反映在冷凍格層：捲到該層、品項閃一下 */
    pendingHighlight = it._id;
    focusTier(it.floor);
    setTimeout(() => { if (pendingHighlight) renderMap(); }, 900);
  } catch (e) {
    console.error(e);
    toast("寫入失敗：" + (e.code || e.message));
  } finally { if ($("#vOk")) $("#vOk").disabled = false; }
}

$("#btnListen").addEventListener("click", startListen);
$("#btnStop").addEventListener("click", stopListen);
window.addEventListener("pagehide", stopListen);
vState(SR ? "講：香菇頭 一包" : "此瀏覽器不支援語音（請用 Android Chrome）", false);

/* ================= 新增／修改視窗：用語音填欄位 ================= */
let fillRec = null, fillListening = false;

function applyVoiceToForm(text) {
  const r = parseUtterance(text, items);
  const sel = $("#fUnit");
  const hasUnit = u => [...sel.options].some(o => o.value === u);
  if (r.name) $("#fName").value = r.name;
  if (r.qty > 0) $("#fQty").value = r.qty;
  if (r.unit && hasUnit(r.unit)) sel.value = r.unit;
  if (r.floor) $("#fFloor").value = String(r.floor);
  if (r.operatorName) $("#fBy").value = r.operatorName;
  const parts = [];
  if (r.name) parts.push("品名「" + r.name + "」");
  if (r.qty) parts.push("數量 " + r.qty + (r.unit && hasUnit(r.unit) ? r.unit : ""));
  if (r.floor) parts.push("樓層 " + floorLabel(r.floor));
  if (r.match) parts.push("（已有品項：" + r.match.name + "）");
  $("#fVoiceHint").textContent = parts.length ? "✅ 已填入：" + parts.join("、") : "沒聽清楚，請再講一次";
}

function toggleVoiceFill() {
  if (!SR) { toast("此瀏覽器不支援語音辨識，請用 Android Chrome 開啟"); return; }
  if (fillListening) { try { fillRec.stop(); } catch (_) {} return; }
  stopListen();                              // 避免與主頁語音搶麥克風
  fillListening = true;
  $("#btnVoiceFill").textContent = "🎤 聽取中…";
  $("#fVoiceHint").style.display = "";
  $("#fVoiceHint").textContent = "請講「品名＋數量」，例如：香菇頭兩包";
  fillRec = new SR();
  fillRec.lang = "zh-TW"; fillRec.continuous = false; fillRec.interimResults = true; fillRec.maxAlternatives = 1;
  fillRec.onresult = e => {
    let interim = "", final = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) final += r[0].transcript; else interim += r[0].transcript;
    }
    if (interim && !final) $("#fVoiceHint").textContent = "…" + interim;
    if (final.trim()) { applyVoiceToForm(final.trim()); try { fillRec.stop(); } catch (_) {} }
  };
  fillRec.onerror = e => {
    fillListening = false; $("#btnVoiceFill").textContent = "🎤 用說的";
    if (e.error === "not-allowed" || e.error === "service-not-allowed") toast("請允許麥克風權限");
  };
  fillRec.onend = () => { fillListening = false; $("#btnVoiceFill").textContent = "🎤 用說的"; };
  try { fillRec.start(); } catch (e) { fillListening = false; $("#btnVoiceFill").textContent = "🎤 用說的"; toast("無法啟動語音：" + e.message); }
}

$("#btnVoiceFill").addEventListener("click", toggleVoiceFill);

/* ================= 掃碼直達 ?f=N ================= */
function gotoFloor(fid) {
  const f = floorOf(fid);
  if (!FLOORS.some(x => x.id === Number(fid))) return;
  const bar = $("#focusBar");
  bar.style.display = "";
  bar.innerHTML = `📍 掃碼指定：<b>${esc(floorLabel(fid))} — ${esc(f.name)}</b>`;
  setTimeout(() => focusTier(fid), 400);
}
const m = new URLSearchParams(location.search).get("f");
if (m) gotoFloor(m);

/* 首次渲染後若有 ?f= 再次定位（等資料進來） */
setTimeout(() => { if (m) gotoFloor(m); }, 2500);
</script>
