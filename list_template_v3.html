<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>凱德佛堂 冷凍庫 材料清單</title>
<style>
  :root{--ink:#12323f;--dim:#6b8299;--green:#1e4d3b;--rule:#dbe6ee}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;padding:14px 16px 24px;background:#fff;color:var(--ink);
       font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
       font-size:16px;line-height:1.75}
  h1{margin:0 0 2px;font-size:20px;color:var(--green)}
  .sub{margin:0 0 14px;font-size:12.5px;color:var(--dim)}
  #status{font-size:13px;color:var(--dim)}
  /* 門 */
  .door{margin:0 0 16px}
  .dh{font-size:15px;font-weight:700;color:var(--green);
      border-bottom:2px solid var(--green);padding-bottom:3px;margin-bottom:6px}
  /* 層 */
  .tier{margin:0 0 9px}
  .tn{display:block;font-size:13.5px;font-weight:700;color:#33566b;margin-bottom:1px}
  .it{display:block;padding-left:10px;word-break:break-all}
  .it.empty{color:#b3c3cd;font-size:14px}
  /* 食材庫 */
  .lib{margin-top:6px;padding-top:10px;border-top:1px dashed var(--rule)}
  .lib .tn{color:#7a6a4f}
  .foot{margin-top:18px;font-size:12px;color:var(--dim);text-align:center}
  .warn{color:#8a2b2b;font-size:14px;margin-top:10px}
</style>
</head>
<body>
<h1>冷凍庫 材料清單</h1>
<p class="sub">凱德佛堂　炊事組</p>
<div id="status">連線中…</div>
<div id="map"></div>
<div class="lib" id="libBox" style="display:none">
  <span class="tn">食材庫（常備・尚未冰）</span>
  <span class="it" id="lib"></span>
</div>
<p class="foot">更新 <span id="upd">—</span></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const STAPLES = __STAPLES__;
const FLOORS  = __FLOORS__;
const DOORS   = [{ key:'U', label:'上門' }, { key:'D', label:'下門' }];

const $ = id => document.getElementById(id);
const app = initializeApp(window.FIREBASE_CONFIG);
const auth = getAuth(app);
const db = getFirestore(app);

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function floorNo(fid){
  const f = FLOORS.find(x => x.id === Number(fid));
  if (!f) return '';
  return FLOORS.filter(x => x.door === f.door).findIndex(x => x.id === f.id) + 1;
}
const byName = (a,b) => String(a.name||'').localeCompare(String(b.name||''), 'zh-Hant');

let ITEMS = [];

function render(){
  const inF = ITEMS.filter(i => (Number(i.qty)||0) > 0 && FLOORS.some(f => f.id === Number(i.floor)));
  let html = '';
  DOORS.forEach(d => {
    html += '<div class="door"><div class="dh">' + d.label + '</div>';
    FLOORS.filter(f => f.door === d.label).forEach(f => {
      const list = inF.filter(i => Number(i.floor) === f.id).sort(byName);
      html += '<div class="tier"><span class="tn">第' + floorNo(f.id) + '層　' + esc(f.name) + '</span>';
      html += list.length
        ? '<span class="it">' + list.map(it => esc(it.name) +
            ((Number(it.qty)||0) > 0 ? ' ' + esc(it.qty) + esc(it.unit||'') : '')).join('、') + '</span>'
        : '<span class="it empty">（目前空的）</span>';
      html += '</div>';
    });
    html += '</div>';
  });
  $('map').innerHTML = html;

  const names = new Set(ITEMS.map(i => i.name));
  const rest = STAPLES.filter(n => !names.has(n));
  if (rest.length){
    $('libBox').style.display = '';
    $('lib').textContent = rest.join('、');
  } else {
    $('libBox').style.display = 'none';
  }
  $('upd').textContent = new Date().toLocaleString('zh-TW', { hour12:false });
}

signInAnonymously(auth).then(() => {
  $('status').textContent = '';
  onSnapshot(query(collection(db, 'frozen_items'), orderBy('name')), snap => {
    ITEMS = snap.docs.map(d => ({ _id: d.id, ...d.data() }));
    render();
  }, err => {
    $('status').innerHTML = '<div class="warn">讀取失敗：' + esc(err.message) + '</div>';
  });
}).catch(e => {
  $('status').innerHTML = '<div class="warn">無法連線：' + esc(e.message) + '</div>';
});
</script>

<script>window.FIREBASE_CONFIG = __FBCONFIG__;</script>
</body>
</html>
