<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>凱德佛堂 冷凍庫 材料清單</title>
<style>
  :root{--ink:#12323f;--dim:#7d909e;--green:#1e4d3b;--rule:#e3ebf0}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;padding:0 0 26px;color:var(--ink);
       background:linear-gradient(180deg,#eef4f1 0,#f7faf9 220px,#f7faf9 100%);
       font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
       font-size:14px;line-height:1.45}
  /* 頁首 */
  .head{background:linear-gradient(135deg,#16382b,#2f6f57 88%);color:#fff;
        padding:20px 18px 16px;border-radius:0 0 24px 24px;margin-bottom:12px}
  h1{margin:0;font-size:20px;letter-spacing:.5px}
  .sub{margin:3px 0 0;font-size:12px;color:#bfd8cd;letter-spacing:1px}
  #status{font-size:12.5px;color:#9fb3ab;padding:0 18px 8px}
  /* 搜尋（貼在頂端，捲動時不會跑掉） */
  .search{position:sticky;top:0;z-index:6;padding:10px 16px 6px;
          background:linear-gradient(180deg,rgba(247,250,249,.99),rgba(247,250,249,.93))}
  .search input{width:100%;border:1px solid #e2ebe6;border-radius:14px;
       padding:10px 14px 10px 38px;font-size:14px;color:var(--ink);outline:none;
       font-family:inherit;-webkit-appearance:none;appearance:none;
       box-shadow:0 1px 3px rgba(20,59,45,.05);
       background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2389a09a' stroke-width='2.2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='M20 20l-4.3-4.3'/></svg>") no-repeat 13px center;background-size:16px 16px}
  .search input::placeholder{color:#a8bac4}
  .search input:focus{border-color:#2f6f57;box-shadow:0 0 0 3px rgba(47,111,87,.13)}
  #hits{padding:0 18px;font-size:11.5px;color:#7f939e}
  #hits:not(:empty){padding:2px 18px 6px}
  mark{background:#ffe9a8;color:inherit;border-radius:3px;padding:0 1px}
  /* 門：獨立區塊卡 */
  #map{padding:0 10px}
  .door{background:#fff;border-radius:16px;margin:0 0 14px;overflow:hidden;
        box-shadow:0 2px 10px rgba(20,59,45,.07)}
  .dh{display:flex;align-items:center;gap:9px;margin:0;padding:13px 14px;
      background:linear-gradient(135deg,#1b4636,#3d7f64);color:#fff;
      font-size:15.5px;font-weight:700;letter-spacing:5px}
  .dh::before{content:'';flex:0 0 auto;width:4px;height:15px;border-radius:2px;
      background:rgba(255,255,255,.6)}
  .dh .cnt{margin-left:auto;font-size:11.5px;font-weight:700;letter-spacing:0;color:#1e4d3b;
      background:#fff;border-radius:999px;padding:2.5px 11px;white-space:nowrap}
  .dbody{padding:10px 12px 6px}
  /* 層：獨立小卡（淺底＋左側綠條） */
  .tier{background:#f6f9f8;border-radius:11px;border-left:3px solid #cde1d8;
        padding:8px 10px 7px;margin:0 0 8px}
  .tier:last-child{margin-bottom:3px}
  .th{display:flex;align-items:center;gap:7px;margin:0 0 6px}
  .tc{margin-left:auto;font-size:10.5px;font-weight:600;color:#8aa39a;
      background:rgba(20,59,45,.05);border-radius:999px;padding:1px 8px}
  .num{flex:0 0 auto;width:17px;height:17px;line-height:17px;text-align:center;
       font-size:10px;font-weight:700;color:#fff;background:#1e4d3b;border-radius:6px}
  .tname{font-size:13px;font-weight:700;color:#143b2d}
  /* 品項明細：三列，名稱＋數量一行，下面小字更新時間／備註 */
  .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:2px 6px}
  .mi{min-width:0;border-bottom:1px solid rgba(20,59,45,.06);padding:3px 0}
  .mr{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 4px}
  .mn{font-size:13px;font-weight:600;white-space:nowrap}
  .mq{margin-left:auto;white-space:nowrap;font-size:11.5px;font-weight:700;color:#1e4d3b;
      font-variant-numeric:tabular-nums}
  .md{margin-top:2px;font-size:10.5px;color:#7e929d;line-height:1.25}
  .empty{color:#b9c6ce;font-size:13px}
  /* 食材庫：另一張卡（暖色帶） */
  .lib{margin:2px 10px 0;background:#fff;border-radius:16px;overflow:hidden;
       box-shadow:0 2px 10px rgba(20,59,45,.06)}
  .libt{display:flex;align-items:center;margin:0;padding:11px 14px;
        font-size:13px;font-weight:700;letter-spacing:1px;color:#7a5c2e;
        background:linear-gradient(135deg,#f2e8d3,#faf5e9)}
  .lcnt{margin-left:auto;font-size:11px;font-weight:600;letter-spacing:0;color:#8a7452;
        background:rgba(255,255,255,.7);border-radius:999px;padding:2px 9px}
  .lib .items{padding:10px 14px 4px}
  .foot{margin:16px 18px 0;font-size:11.5px;color:#a3b3bd;text-align:center}
  .warn{color:#8a2b2b;font-size:14px}
</style>
</head>
<body>
<div class="head"><h1>冷凍庫 材料清單</h1><p class="sub">凱德佛堂　炊事組</p></div>
<div class="search"><input id="q" type="search" placeholder="搜尋食材…" autocomplete="off" enterkeyhint="search"></div>
<div id="hits"></div>
<div id="status">連線中…</div>
<div id="map"></div>
<div class="lib" id="libBox" style="display:none">
  <p class="libt"><span>食材庫（常備・尚未冰）</span><span class="lcnt" id="libN"></span></p>
  <div class="items" id="lib"></div>
</div>
<p class="foot">更新 <span id="upd">—</span></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const STAPLES = __STAPLES__;
const FLOORS  = __FLOORS__;
const DOORS   = [{ key:'U', label:'上門' }, { key:'D', label:'下門' }];

const $ = id => document.getElementById(id);
const app = initializeApp(window.FIREBASE_CONFIG);
const auth = getAuth(app);
const db = getFirestore(app);

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function floorNo(fid){
  const f = FLOORS.find(x => x.id === Number(fid));
  if (!f) return '';
  return FLOORS.filter(x => x.door === f.door).findIndex(x => x.id === f.id) + 1;
}
const byName = (a,b) => String(a.name||'').localeCompare(String(b.name||''), 'zh-Hant');

let ITEMS = [];
let QUERY = '';

/* 搜尋字串加上黃底標記（先轉義再包 mark，避免 XSS） */
function hi(t){
  const s = String(t == null ? '' : t);
  const q = QUERY.trim();
  if (!q) return esc(s);
  const i = s.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return esc(s);
  return esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + q.length)) + '</mark>' + esc(s.slice(i + q.length));
}

function fmtT(ms){
  if (!ms) return '';
  const d = new Date(Number(ms));
  const p = n => String(n).padStart(2, '0');
  return (d.getMonth()+1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function mi(it){
  const q = Number(it.qty) || 0;
  let md = [];
  if (it.updatedAt) md.push('更新 ' + fmtT(it.updatedAt));
  if (it.note) md.push('備註 ' + hi(it.note));
  return '<div class="mi">' +
    '<div class="mr"><span class="mn">' + hi(it.name) + '</span>' +
    (q > 0 ? '<span class="mq">' + esc(it.qty) + esc(it.unit||'') + '</span>' : '') +
    '</div>' +
    (md.length ? '<div class="md">' + md.join('　·　') + '</div>' : '') +
    '</div>';
}

function render(){
  const q = QUERY.trim().toLowerCase();
  const hit = v => !q || String(v == null ? '' : v).toLowerCase().indexOf(q) >= 0;
  const inF = ITEMS.filter(i => (Number(i.qty)||0) > 0 && FLOORS.some(f => f.id === Number(i.floor)))
                   .filter(i => hit(i.name) || hit(i.note));
  let html = '';
  DOORS.forEach(d => {
    let body = '', nTier = 0, nItem = 0;
    FLOORS.filter(f => f.door === d.label).forEach(f => {
      const list = inF.filter(i => Number(i.floor) === f.id).sort(byName);
      if (q && !list.length) return;              /* 搜尋中：沒中的層直接不顯示 */
      nTier++; nItem += list.length;
      body += '<div class="tier"><div class="th"><span class="num">' + floorNo(f.id) +
              '</span><span class="tname">' + esc(f.name) + '</span>' +
              '<span class="tc">' + list.length + ' 項</span></div>';
      body += list.length
        ? '<div class="items">' + list.map(mi).join('') + '</div>'
        : '<div class="empty">（目前空的）</div>';
      body += '</div>';
    });
    if (body) {
      html += '<section class="door"><div class="dh"><span class="dl">' + d.label + '</span>' +
              '<span class="cnt">' + nTier + ' 層 · ' + nItem + ' 項</span></div>' +
              '<div class="dbody">' + body + '</div></section>';
    }
  });
  $('map').innerHTML = html;

  const names = new Set(ITEMS.map(i => i.name));
  const rest = STAPLES.filter(n => !names.has(n)).filter(hit);
  if (rest.length){
    $('libBox').style.display = '';
    $('libN').textContent = rest.length + ' 項';
    $('lib').innerHTML = rest.map(n => '<div class="mi"><div class="mr"><span class="mn">' + hi(n) + '</span></div></div>').join('');
  } else {
    $('lib').innerHTML = '';
    $('libBox').style.display = 'none';
  }

  const n = inF.length + rest.length;
  $('hits').textContent = q
    ? (n ? '找到 ' + n + ' 項' : '沒有符合「' + QUERY.trim() + '」的食材')
    : '';
  $('upd').textContent = new Date().toLocaleString('zh-TW', { hour12:false });
}

$('q').addEventListener('input', () => { QUERY = $('q').value; render(); });

signInAnonymously(auth).then(() => {
  $('status').textContent = '';
  onSnapshot(query(collection(db, 'frozen_items'), orderBy('name')), snap => {
    ITEMS = snap.docs.map(d => ({ _id: d.id, ...d.data() }));
    render();
  }, err => {
    $('status').innerHTML = '<div class="warn">讀取失敗：' + esc(err.message) + '</div>';
  });
}).catch(e => {
  $('status').innerHTML = '<div class="warn">無法連線：' + esc(e.message) + '</div>';
});
</script>

<script>window.FIREBASE_CONFIG = __FBCONFIG__;</script>
</body>
</html>
